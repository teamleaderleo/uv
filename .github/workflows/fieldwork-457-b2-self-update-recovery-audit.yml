name: Fieldwork 457 B2 custom updater interruption

on:
  pull_request:
    paths:
      - .github/workflows/fieldwork-457-b2-self-update-recovery-audit.yml
      - crates/uv/tests/it/main.rs
      - crates/uv/tests/it/fieldwork_self_update_recovery.rs

permissions:
  contents: read

jobs:
  custom-ghe-interruption:
    name: Windows custom-route canonical executable
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CANDIDATE_HEAD: 77e107dd2665f660c461998bc83174bf26ee7cf6
      CI: 1
    steps:
      - name: Check out exact execution carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity and execution-only fence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mergeBase = git merge-base HEAD $env:CANDIDATE_HEAD
          if ($mergeBase -ne $env:CANDIDATE_HEAD) {
            throw "Carrier does not descend from candidate head: $mergeBase"
          }
          $expected = @(
            '.github/workflows/fieldwork-457-b2-self-update-recovery-audit.yml'
            'crates/uv/tests/it/fieldwork_self_update_recovery.rs'
            'crates/uv/tests/it/main.rs'
          ) | Sort-Object
          $changed = @(git diff --name-only "$env:CANDIDATE_HEAD..HEAD") | Sort-Object
          if (Compare-Object $expected $changed) {
            throw "Unexpected carrier diff. Expected: $($expected -join ', '); actual: $($changed -join ', ')"
          }
          git diff --check "$env:CANDIDATE_HEAD..HEAD"
          New-Item -ItemType Directory -Force -Path receipt | Out-Null
          @(
            "carrier_head=$(git rev-parse HEAD)"
            "candidate_head=$env:CANDIDATE_HEAD"
            "runner=$env:RUNNER_OS"
          ) | Set-Content receipt/identity.txt
          rustc --version | Tee-Object -FilePath receipt/rust-version.txt
          cargo --version | Tee-Object -FilePath receipt/cargo-version.txt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: fieldwork-457-b2-custom-updater
          cache-on-failure: true

      - name: Run exact custom-route interruption characterization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p uv --test it --features self-update fieldwork_custom_ghe_interruption_displaces_canonical_executable -- --nocapture 2>&1 |
            Tee-Object -FilePath receipt/custom-ghe-interruption.log

      - name: Assemble receipt
        if: always()
        shell: pwsh
        run: |
          @{
            carrierHead = (git rev-parse HEAD)
            candidateHead = $env:CANDIDATE_HEAD
            platform = 'windows-latest'
            route = 'UV_INSTALLER_GHE_BASE_URL override -> run_custom_updater -> axoupdater 0.10.0'
            invariant = 'canonical uv.exe is absent and .previous.exe remains after process interruption'
          } | ConvertTo-Json | Set-Content receipt/receipt.json

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-457-b2-custom-updater-interruption
          path: receipt/
          if-no-files-found: error
          retention-days: 30
