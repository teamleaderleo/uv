name: Fieldwork tool upgrade entrypoint recovery v2

on:
  pull_request:
    branches:
      - fieldwork/tool-upgrade-entrypoint-recovery-v2-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-recovery:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SOURCE_BASE: 507230998c9541d67814b57463ac00e454ff6991
    steps:
      - name: Check out carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify carrier boundary
        shell: pwsh
        run: |
          $baseRef = 'origin/${{ github.event.pull_request.base.ref }}'
          $headSha = '${{ github.event.pull_request.head.sha }}'
          $files = @(git diff --name-only "$baseRef...$headSha" | Sort-Object)
          $expected = @(
            'scripts/fieldwork/generate-tool-upgrade-entrypoint-recovery-v2.py',
            'scripts/fieldwork/validate-tool-upgrade-entrypoint-recovery-v2.ps1'
          ) | Sort-Object
          $comparison = @(Compare-Object $expected $files)
          if ($comparison.Count -ne 0) { throw "unexpected carrier files: $($files -join ', ')" }
          Copy-Item scripts/fieldwork/generate-tool-upgrade-entrypoint-recovery-v2.py $env:RUNNER_TEMP/generate.py
          Copy-Item scripts/fieldwork/validate-tool-upgrade-entrypoint-recovery-v2.ps1 $env:RUNNER_TEMP/validate.ps1

      - name: Generate exact-source candidate
        shell: pwsh
        run: |
          git checkout --detach $env:SOURCE_BASE
          python $env:RUNNER_TEMP/generate.py
          rustup component add rustfmt clippy
          cargo fmt --all
          $files = @(git diff --name-only | Sort-Object)
          if ($files.Count -ne 1 -or $files[0] -ne 'crates/uv/src/commands/tool/upgrade.rs') {
            throw "unexpected generated source files: $($files -join ', ')"
          }
          git diff --check
          cargo fmt --all --check
          git diff | Out-File -Encoding utf8 $env:RUNNER_TEMP/source.patch

      - name: Compile affected source
        shell: pwsh
        run: |
          cargo check --locked -p uv
          cargo clippy --locked -p uv --lib -- -D warnings

      - name: Build exact-source uv
        shell: pwsh
        run: cargo build --locked -p uv --features self-update

      - name: Validate recovery matrix
        shell: pwsh
        run: |
          & $env:RUNNER_TEMP/validate.ps1 -UvPath (Resolve-Path target/debug/uv.exe) -Root (Join-Path $env:RUNNER_TEMP 'tool-upgrade-recovery-v2')

      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-upgrade-entrypoint-recovery-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source.patch
            ${{ runner.temp }}/tool-upgrade-recovery-v2/recovery-transcript.txt
            ${{ runner.temp }}/tool-upgrade-recovery-v2/noop/tools/ruff/uv-receipt.toml
            ${{ runner.temp }}/tool-upgrade-recovery-v2/dependency/tools/ruff/uv-receipt.toml
          if-no-files-found: warn
          retention-days: 14
