name: Research 459 stub backend matrix

on:
  push:
    branches: [research/459-stub-backend-runtime]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install released UV
        run: |
          python -m pip install 'uv==0.12.3'
          uv --version
      - name: Build and inspect stub-only wheels
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/stub-matrix"; rm -rf "$ROOT"; mkdir -p "$ROOT"
          mkbase(){ mkdir -p "$ROOT/$1/src/foo-stubs"; printf '%s\n' 'def answer() -> int: ...' > "$ROOT/$1/src/foo-stubs/__init__.pyi"; }
          inspect(){ label="$1"; wheel=$(find "$ROOT/$label/dist" -maxdepth 1 -name '*.whl' -print -quit 2>/dev/null || true); if [ -z "$wheel" ]; then echo "WHEEL $label NONE"; echo "HAS_STUB $label false"; return; fi; python - "$label" "$wheel" <<'PY'
          import sys, zipfile
          label,wheel=sys.argv[1:]
          with zipfile.ZipFile(wheel) as z: names=sorted(z.namelist())
          print('WHEEL',label,wheel)
          for n in names: print(' ',n)
          print('HAS_STUB',label,'foo-stubs/__init__.pyi' in names)
          PY
          }
          build(){ label="$1"; (cd "$ROOT/$label" && uv build --wheel --out-dir dist -v) >"$ROOT/$label/build.log" 2>&1; code=$?; echo "BUILD_EXIT $label $code"; cat "$ROOT/$label/build.log"; inspect "$label"; }
          ver(){ uv run --no-project --with "$1" python - "$2" <<'PY'
          import importlib.metadata,sys
          print('RESOLVED',sys.argv[1],importlib.metadata.version(sys.argv[1]))
          PY
          }
          ver 'pdm-backend' pdm-backend
          ver 'setuptools>=61' setuptools
          ver 'scikit-build-core>=0.12' scikit-build-core
          ver 'maturin>=1.0,<2.0' maturin

          mkbase pdm; cat > "$ROOT/pdm/pyproject.toml" <<'TOML'
          [project]
          name="foo-stubs"
          version="0.1.0"
          requires-python=">=3.9"
          [build-system]
          requires=["pdm-backend"]
          build-backend="pdm.backend"
          TOML
          build pdm

          for x in setuptools-current setuptools-68 setuptools-68-config setuptools-69; do mkbase "$x"; done
          cat > "$ROOT/setuptools-current/pyproject.toml" <<'TOML'
          [project]
          name="foo-stubs"
          version="0.1.0"
          requires-python=">=3.9"
          [build-system]
          requires=["setuptools>=61"]
          build-backend="setuptools.build_meta"
          TOML
          cat > "$ROOT/setuptools-68/pyproject.toml" <<'TOML'
          [project]
          name="foo-stubs"
          version="0.1.0"
          requires-python=">=3.9"
          [build-system]
          requires=["setuptools==68.2.2"]
          build-backend="setuptools.build_meta"
          TOML
          cat > "$ROOT/setuptools-68-config/pyproject.toml" <<'TOML'
          [project]
          name="foo-stubs"
          version="0.1.0"
          requires-python=">=3.9"
          [tool.setuptools.package-data]
          "foo-stubs"=["*.pyi"]
          [build-system]
          requires=["setuptools==68.2.2"]
          build-backend="setuptools.build_meta"
          TOML
          cat > "$ROOT/setuptools-69/pyproject.toml" <<'TOML'
          [project]
          name="foo-stubs"
          version="0.1.0"
          requires-python=">=3.9"
          [build-system]
          requires=["setuptools==69.0.0"]
          build-backend="setuptools.build_meta"
          TOML
          build setuptools-current; build setuptools-68; build setuptools-68-config; build setuptools-69

          for x in scikit-explicit scikit-auto scikit-uv-contract; do mkbase "$x"; done
          cat > "$ROOT/scikit-explicit/pyproject.toml" <<'TOML'
          [project]
          name="foo-stubs"
          version="0.1.0"
          requires-python=">=3.9"
          [tool.scikit-build]
          minimum-version="build-system.requires"
          wheel.cmake=false
          wheel.packages=["src/foo-stubs"]
          [build-system]
          requires=["scikit-build-core>=0.12","pybind11>=3"]
          build-backend="scikit_build_core.build"
          TOML
          cat > "$ROOT/scikit-auto/pyproject.toml" <<'TOML'
          [project]
          name="foo-stubs"
          version="0.1.0"
          requires-python=">=3.9"
          [tool.scikit-build]
          minimum-version="build-system.requires"
          wheel.cmake=false
          [build-system]
          requires=["scikit-build-core>=0.12","pybind11>=3"]
          build-backend="scikit_build_core.build"
          TOML
          cat > "$ROOT/scikit-uv-contract/pyproject.toml" <<'TOML'
          [project]
          name="foo-stubs"
          version="0.1.0"
          requires-python=">=3.9"
          [tool.scikit-build]
          minimum-version="build-system.requires"
          [build-system]
          requires=["scikit-build-core>=0.12","pybind11>=3"]
          build-backend="scikit_build_core.build"
          TOML
          build scikit-explicit; build scikit-auto; build scikit-uv-contract

          mkbase maturin-uv-contract; cat > "$ROOT/maturin-uv-contract/pyproject.toml" <<'TOML'
          [project]
          name="foo-stubs"
          version="0.1.0"
          requires-python=">=3.9"
          [build-system]
          requires=["maturin>=1.0,<2.0"]
          build-backend="maturin"
          TOML
          build maturin-uv-contract
