name: Fieldwork unit 02 source publication

on:
  pull_request:
    branches: [fieldwork/02-runner-base]
    paths:
      - .github/workflows/fieldwork-unit-02-isolated.yml
      - .github/workflows/fieldwork-unit-02-last-mile.yml
      - scripts/fieldwork/apply-unit-02-last-mile.py
      - scripts/fieldwork/unit-02-activation-probe.sh
      - scripts/fieldwork/unit-02-platform-matrix.sh
      - scripts/fieldwork/unit-02-argv0-probe.py

permissions:
  contents: write

concurrency:
  group: fieldwork-unit-02-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify validated carrier identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATED_CARRIER: c8a5c36d60a5cc35f496f583146967e210f87810
          EXECUTION_BASE: d2ebfd92457b0047a4b02e3ccb8431769e12b145
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git merge-base "$EXECUTION_BASE" HEAD)" = "$EXECUTION_BASE"
          git diff --name-only "$VALIDATED_CARRIER"...HEAD | sort -u > "${{ runner.temp }}/post-validation-delta.txt"
          test "$(cat "${{ runner.temp }}/post-validation-delta.txt")" = '.github/workflows/fieldwork-unit-02-last-mile.yml'
          git diff --name-only "$EXECUTION_BASE"...HEAD | sort > "${{ runner.temp }}/carrier-files.txt"
          cat > "${{ runner.temp }}/expected-carrier-files.txt" <<'EOF'
          .github/workflows/fieldwork-unit-02-isolated.yml
          .github/workflows/fieldwork-unit-02-last-mile.yml
          scripts/fieldwork/apply-unit-02-last-mile.py
          scripts/fieldwork/unit-02-activation-probe.sh
          scripts/fieldwork/unit-02-argv0-probe.py
          scripts/fieldwork/unit-02-platform-matrix.sh
          EOF
          diff -u "${{ runner.temp }}/expected-carrier-files.txt" "${{ runner.temp }}/carrier-files.txt"
          python -m py_compile scripts/fieldwork/apply-unit-02-last-mile.py scripts/fieldwork/unit-02-argv0-probe.py
          /bin/sh -n scripts/fieldwork/unit-02-platform-matrix.sh
          /bin/bash -n scripts/fieldwork/unit-02-activation-probe.sh

      - name: Recreate exact validated source
        run: |
          set -euo pipefail
          rustup component add rustfmt
          python scripts/fieldwork/apply-unit-02-last-mile.py | tee "${{ runner.temp }}/candidate-counts.txt"
          cargo fmt --all
          git diff --check
          git diff --name-only | sort > "${{ runner.temp }}/published-files.txt"
          cat > "${{ runner.temp }}/expected-files.txt" <<'EOF'
          crates/uv-install-wheel/src/wheel.rs
          crates/uv-virtualenv/src/virtualenv.rs
          crates/uv/src/commands/project/run.rs
          crates/uv/tests/python/venv.rs
          EOF
          diff -u "${{ runner.temp }}/expected-files.txt" "${{ runner.temp }}/published-files.txt"
          grep -F 'UNIT_02_SOURCE_REALPATH_REPLACED=5' "${{ runner.temp }}/candidate-counts.txt"
          grep -F 'UNIT_02_TEST_REALPATH_EXPECTATIONS=2' "${{ runner.temp }}/candidate-counts.txt"
          grep -F 'UNIT_02_LEGACY_REALPATH_RECOGNIZER=2' "${{ runner.temp }}/candidate-counts.txt"
          grep -F 'UNIT_02_DIRNAME_DELIMITERS=wheel:2,virtualenv:4,run:4,venv-test:4' "${{ runner.temp }}/candidate-counts.txt"

      - name: Publish one source-only commit
        env:
          SOURCE_BASE: 79bbface771210df216b738e9bdc7df95e5a9e6b
          TARGET_BRANCH: upstream/02-busybox-realpath
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="${{ runner.temp }}/unit-02-source.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$SOURCE_BASE"
          git add -- crates/uv-install-wheel/src/wheel.rs crates/uv-virtualenv/src/virtualenv.rs crates/uv/src/commands/project/run.rs crates/uv/tests/python/venv.rs
          tree=$(git write-tree)
          commit=$(printf '%s\n\n%s\n' 'fix: make relocatable launchers compatible with BusyBox realpath' 'Remove unsupported realpath delimiters, update relocatable venv expectations, and keep recognizing historical python and python3 shebangs.' | git commit-tree "$tree" -p "$SOURCE_BASE")
          printf 'validated_run=30753911776\nvalidated_carrier=c8a5c36d60a5cc35f496f583146967e210f87810\nsource_tree=%s\nsource_commit=%s\n' "$tree" "$commit" | tee "${{ runner.temp }}/source-receipt.txt"
          git diff-tree --no-commit-id --name-only -r "$commit" | sort > "${{ runner.temp }}/commit-files.txt"
          diff -u "${{ runner.temp }}/expected-files.txt" "${{ runner.temp }}/commit-files.txt"
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-02-final-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/post-validation-delta.txt
            ${{ runner.temp }}/carrier-files.txt
            ${{ runner.temp }}/candidate-counts.txt
            ${{ runner.temp }}/published-files.txt
            ${{ runner.temp }}/source-receipt.txt
            ${{ runner.temp }}/commit-files.txt
          if-no-files-found: error
          retention-days: 14
