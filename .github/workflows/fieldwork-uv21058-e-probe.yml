name: Fieldwork uv21058 E probe

on:
  push:
    branches:
      - fieldwork/uv21058-thunderdome-runner
    paths:
      - .github/workflows/fieldwork-uv21058-e-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fieldwork/uv21058-e-scoped-central
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: fieldwork-uv21058
          key: E-scoped-central

      - name: Build uv
        run: cargo build -p uv --bin uv --no-default-features

      - name: Invalid tool-directory name
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir "$tmp/tool backup"
          set +e
          output="$(UV_TOOL_DIR="$tmp" target/debug/uv tool upgrade --all 2>&1)"
          status=$?
          set -e
          printf '%s\nexit: %s\n' "$output" "$status"
          test "$status" -eq 2
          grep -q '^error: Failed to inspect installed tools$' <<< "$output"
          grep -q 'Not a valid package or extra name: "tool backup"' <<< "$output"
          grep -q '^hint: Inspect the uv tool directory at ' <<< "$output"
          grep -q 'move the invalid directory outside it, or remove it' <<< "$output"
          ! grep -q 'Nothing to upgrade' <<< "$output"

      - name: Empty tool directory
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          set +e
          output="$(UV_TOOL_DIR="$tmp" target/debug/uv tool upgrade --all 2>&1)"
          status=$?
          set -e
          printf '%s\nexit: %s\n' "$output" "$status"
          test "$status" -eq 0
          grep -q '^Nothing to upgrade$' <<< "$output"

      - name: Receipt read I/O error
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/ruff/uv-receipt.toml"
          set +e
          output="$(UV_TOOL_DIR="$tmp" target/debug/uv tool upgrade --all 2>&1)"
          status=$?
          set -e
          printf '%s\nexit: %s\n' "$output" "$status"
          test "$status" -eq 2
          grep -q '^error: Failed to inspect installed tools$' <<< "$output"
          ! grep -q '^hint:' <<< "$output"
          ! grep -q 'Nothing to upgrade' <<< "$output"

      - name: Sibling commands remain scoped out
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir "$tmp/tool backup"
          for command in \
            'tool list' \
            'tool uninstall --all' \
            '--preview tool audit --all'
          do
            set +e
            output="$(UV_TOOL_DIR="$tmp" target/debug/uv $command 2>&1)"
            status=$?
            set -e
            printf '\n== uv %s ==\n%s\nexit: %s\n' "$command" "$output" "$status"
            test "$status" -eq 2
            grep -q 'Not a valid package or extra name: "tool backup"' <<< "$output"
            ! grep -q '^hint:' <<< "$output"
          done
