name: Fieldwork 21006 source publication

on:
  pull_request:
    branches:
      - fieldwork/21006-source-publication-base
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_BASE: 507230998c9541d67814b57463ac00e454ff6991
    steps:
      - name: Check out carrier
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify carrier boundary
        run: |
          set -euo pipefail
          base_ref="origin/${{ github.event.pull_request.base.ref }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only "$base_ref...$head_sha" | sort)
          expected=(scripts/fieldwork/generate-21006-comment-preservation.py)
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")
          cp scripts/fieldwork/generate-21006-comment-preservation.py "$RUNNER_TEMP/generate.py"

      - name: Generate exact source and revalidate
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_BASE"
          python "$RUNNER_TEMP/generate.py"
          rustup component add rustfmt clippy
          cargo fmt --all
          test "$(git diff --name-only)" = "crates/uv-workspace/src/pyproject_mut.rs"
          git diff --check
          cargo fmt --all --check
          cargo test --locked -p uv-workspace pyproject_mut::test::add_optional_dependency_preserves_inline_comment_without_trailing_comma -- --exact
          cargo test --locked -p uv-workspace pyproject_mut::test::add_optional_dependency_preserves_inline_comment_with_trailing_comma -- --exact
          cargo test --locked -p uv-workspace pyproject_mut::test::reformat_preserves_inline_comment
          cargo test --locked -p uv-workspace pyproject_mut::test::reformat_preserves_trailing_comment_sequence -- --exact
          cargo test --locked -p uv-workspace pyproject_mut::test::reformat_preserves_trailing_comment_depth -- --exact
          cargo check --locked -p uv-workspace
          cargo clippy --locked -p uv-workspace --all-targets -- -D warnings

      - name: Publish clean one-file source
        run: |
          set -euo pipefail
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git switch -C candidate/21006-comment-preservation
          git add crates/uv-workspace/src/pyproject_mut.rs
          git commit -m 'Preserve final inline comments during dependency updates'
          test "$(git diff --name-only "$SOURCE_BASE..HEAD")" = "crates/uv-workspace/src/pyproject_mut.rs"
          git push origin HEAD:refs/heads/candidate/21006-comment-preservation --force
          {
            echo "base=$SOURCE_BASE"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "source_blob=$(git rev-parse HEAD:crates/uv-workspace/src/pyproject_mut.rs)"
          } > "$RUNNER_TEMP/publication-receipt.txt"

      - name: Retain publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: 21006-source-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-receipt.txt
          if-no-files-found: error
          retention-days: 14
