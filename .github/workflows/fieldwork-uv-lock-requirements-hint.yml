name: Fieldwork uv lock requirements hint validation

on:
  pull_request:
    branches:
      - fieldwork/uv-lock-requirements-hint-base
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_BASE: 49e2fc5c821bb69a528308a036b17446bb5ab5a6
      SOURCE_BRANCH: candidate/uv-lock-requirements-hint
    steps:
      - name: Check out validation carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify carrier boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > "$RUNNER_TEMP/carrier-files.txt"
          cat > "$RUNNER_TEMP/expected-carrier-files.txt" <<'EOF'
          .github/workflows/fieldwork-uv-lock-requirements-hint.yml
          scripts/fieldwork/generate-uv-lock-requirements-hint.py
          EOF
          diff -u "$RUNNER_TEMP/expected-carrier-files.txt" "$RUNNER_TEMP/carrier-files.txt"
          cp scripts/fieldwork/generate-uv-lock-requirements-hint.py "$RUNNER_TEMP/generate.py"

      - name: Generate exact candidate from upstream base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_BASE"
          python "$RUNNER_TEMP/generate.py"
          git add -N crates/uv/tests/pip_install/uv_lock_requirements_hint.rs
          git diff --name-only | sort > "$RUNNER_TEMP/source-files.txt"
          cat > "$RUNNER_TEMP/expected-source-files.txt" <<'EOF'
          crates/uv-requirements/Cargo.toml
          crates/uv-requirements/src/specification.rs
          crates/uv/src/commands/diagnostics.rs
          crates/uv/tests/pip_install/main.rs
          crates/uv/tests/pip_install/uv_lock_requirements_hint.rs
          EOF
          diff -u "$RUNNER_TEMP/expected-source-files.txt" "$RUNNER_TEMP/source-files.txt"
          git diff --check
          git diff --stat | tee "$RUNNER_TEMP/source-stat.txt"
          git diff > "$RUNNER_TEMP/source.patch"

      - name: Install Rust components
        shell: bash
        run: rustup component add rustfmt clippy

      - name: Run formatting and compile gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check -p uv-requirements -p uv

      - name: Run focused integration controls
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p uv --test pip_install --features test-python,test-pypi \
            uv_lock_requirements_hint -- --nocapture \
            | tee "$RUNNER_TEMP/focused-tests.txt"

      - name: Run affected clippy gates
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p uv-requirements -p uv --tests \
            --features test-python,test-pypi -- -D warnings

      - name: Publish one clean source commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = 5
          git config user.name "fieldwork-validation"
          git config user.email "fieldwork-validation@users.noreply.github.com"
          git add \
            crates/uv-requirements/Cargo.toml \
            crates/uv-requirements/src/specification.rs \
            crates/uv/src/commands/diagnostics.rs \
            crates/uv/tests/pip_install/main.rs \
            crates/uv/tests/pip_install/uv_lock_requirements_hint.rs
          git commit -m "fix: hint when uv lockfiles are used as requirements"
          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" = 1
          git diff --exit-code "$EXPECTED_BASE"..HEAD -- .github scripts
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
          git rev-parse HEAD | tee "$RUNNER_TEMP/source-head.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/source-tree.txt"

      - name: Retain validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uv-lock-requirements-hint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/carrier-files.txt
            ${{ runner.temp }}/source-files.txt
            ${{ runner.temp }}/source-stat.txt
            ${{ runner.temp }}/source.patch
            ${{ runner.temp }}/focused-tests.txt
            ${{ runner.temp }}/source-head.txt
            ${{ runner.temp }}/source-tree.txt
          if-no-files-found: warn
          retention-days: 14
