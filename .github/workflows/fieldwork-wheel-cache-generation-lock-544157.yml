name: Fieldwork wheel cache generation lock current main

on:
  pull_request:
    branches:
      - fieldwork/wheel-cache-generation-lock-544157-base
    paths:
      - 'fieldwork/wheel-cache-generation-lock/**'
      - '.github/workflows/fieldwork-wheel-cache-generation-lock-544157.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CURRENT_SOURCE_HEAD: 544157b31dbc6007bfdfe2789d3d068278fdb57d
      CLEAN_SOURCE_BRANCH: fix/serialize-wheel-cache-publication-544157
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out exact uv source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/upstream-544157
          path: uv-current
          persist-credentials: false

      - name: Apply exact current-main candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C uv-current rev-parse HEAD)" = "$CURRENT_SOURCE_HEAD"
          python3 -m py_compile fieldwork/wheel-cache-generation-lock/apply_generation_lock.py
          python3 fieldwork/wheel-cache-generation-lock/apply_generation_lock.py uv-current
          git -C uv-current diff --check
          test "$(git -C uv-current diff --name-only)" = "crates/uv-distribution/src/distribution_database.rs"
          rustup component add rustfmt clippy
          (cd uv-current && cargo fmt --all)
          (cd uv-current && cargo fmt --all -- --check)
          git -C uv-current diff --check
          git -C uv-current diff --binary > fieldwork-wheel-cache-generation-lock-544157.patch

      - name: Compile affected crate
        working-directory: uv-current
        run: cargo check --locked -p uv-distribution

      - name: Execute publication serialization test
        working-directory: uv-current
        run: |
          set -o pipefail
          cargo test --locked -p uv-distribution \
            distribution_database::tests::wheel_publication_lock_serializes_link_and_pointer_updates \
            -- --exact --nocapture 2>&1 | tee generation-lock-test-output.txt
          grep -F "running 1 test" generation-lock-test-output.txt
          grep -F "test distribution_database::tests::wheel_publication_lock_serializes_link_and_pointer_updates ... ok" generation-lock-test-output.txt

      - name: Run affected Clippy gate
        working-directory: uv-current
        run: cargo clippy --locked -p uv-distribution --tests -- -D warnings

      - name: Publish exact clean source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C uv-current config user.name "teamleaderleo"
          git -C uv-current config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git -C uv-current switch -C "$CLEAN_SOURCE_BRANCH"
          git -C uv-current add -- crates/uv-distribution/src/distribution_database.rs
          git -C uv-current diff --cached --check
          test "$(git -C uv-current diff --cached --name-only)" = "crates/uv-distribution/src/distribution_database.rs"
          git -C uv-current commit -m "fix: serialize wheel cache publication on all platforms"
          git -C uv-current push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${CLEAN_SOURCE_BRANCH}"
          git -C uv-current rev-parse HEAD > fieldwork-wheel-cache-generation-lock-544157-clean-head.txt

      - name: Upload exact receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: fieldwork-wheel-cache-generation-lock-544157
          path: |
            fieldwork-wheel-cache-generation-lock-544157.patch
            fieldwork-wheel-cache-generation-lock-544157-clean-head.txt
            uv-current/generation-lock-test-output.txt
          if-no-files-found: warn
          retention-days: 30
