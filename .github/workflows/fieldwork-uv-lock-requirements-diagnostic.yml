name: Fieldwork uv lock requirements diagnostic

on:
  pull_request:
    branches:
      - fieldwork/uv-lock-requirements-diagnostic
    paths:
      - .github/workflows/fieldwork-uv-lock-requirements-diagnostic.yml

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  SOURCE_BASE: 1da26a68629be6ae5fd7f924a7d49ff54763a7df
  SOURCE_SHA: ba55497fe83ea9bb07c04452f8ba190fa4440a05

jobs:
  focused-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact repaired source head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity and fence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --name-only "$SOURCE_BASE"..."$SOURCE_SHA" | sort > "$RUNNER_TEMP/changed-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          crates/uv-requirements/src/sources.rs
          crates/uv/tests/pip_install/main.rs
          crates/uv/tests/pip_install/uv_lock_requirements.rs
          EOF
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/changed-files.txt"
          git diff --check "$SOURCE_BASE"..."$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply requirements-only parse-failure experiment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1))

          sources = Path("crates/uv-requirements/src/sources.rs")
          replace_once(sources, "use uv_scripts::Pep723Metadata;\n", "")
          replace_once(
              sources,
              '''        } else if is_uv_lockfile(&path) {
                      return Err(anyhow::anyhow!(
                          "The file `{}` appears to be a uv lockfile, but requirements must be specified in `requirements.txt` format",
                          path.user_display(),
                      ));
          ''',
              "",
          )
          replace_once(
              sources,
              '''
          /// Returns `true` if the path names a lockfile that uv itself can generate.
          fn is_uv_lockfile(path: &Path) -> bool {
              if !path.is_file() {
                  return false;
              }

              let Some(file_name) = path.file_name() else {
                  return false;
              };

              if file_name == OsStr::new("uv.lock") {
                  return true;
              }

              if path.extension() != Some(OsStr::new("lock")) {
                  return false;
              }
              let Some(script_name) = path.file_stem() else {
                  return false;
              };
              let script_path = path.with_file_name(script_name);
              let Ok(contents) = fs_err::read(script_path) else {
                  return false;
              };

              Pep723Metadata::parse(&contents).is_ok_and(|metadata| metadata.is_some())
          }
          ''',
              "",
          )
          replace_once(
              sources,
              '''    /// Dependencies were provided via a `requirements.txt` file (e.g., `pip install -r requirements.txt`).
              RequirementsTxt(PathBuf),
          ''',
              '''    /// Dependencies were provided via a `requirements.txt` file.
              RequirementsTxt(PathBuf),
              /// Dependencies were provided via an explicit requirements-file flag such as `-r`.
              /// Parse failures on this lane can include diagnostics for uv-owned lockfile names.
              RequirementsTxtWithUvLockDiagnostic(PathBuf),
          ''',
          )
          replace_once(
              sources,
              '''        Ok(Self::RequirementsTxt(path))
              }

              /// Parse a [`RequirementsSource`] from a `constraints.txt` file.
          ''',
              '''        Ok(Self::RequirementsTxtWithUvLockDiagnostic(path))
              }

              /// Parse a [`RequirementsSource`] from a `constraints.txt` file.
          ''',
          )
          replace_once(
              sources,
              '''            Self::PylockToml(path)
                          | Self::RequirementsTxt(path)
                          | Self::Pep723Script(path)
          ''',
              '''            Self::PylockToml(path)
                          | Self::RequirementsTxt(path)
                          | Self::RequirementsTxtWithUvLockDiagnostic(path)
                          | Self::Pep723Script(path)
          ''',
          )

          specification = Path("crates/uv-requirements/src/specification.rs")
          replace_once(
              specification,
              "use std::collections::BTreeMap;\nuse std::path::{Path, PathBuf};\n",
              "use std::collections::BTreeMap;\nuse std::ffi::OsStr;\nuse std::path::{Path, PathBuf};\n",
          )
          replace_once(
              specification,
              "            RequirementsSource::RequirementsTxt(path) => {\n",
              '''            RequirementsSource::RequirementsTxt(path)
                          | RequirementsSource::RequirementsTxtWithUvLockDiagnostic(path) => {
          ''',
          )
          replace_once(
              specification,
              '''                let requirements_txt =
                              RequirementsTxt::parse_with_cache(path, &*CWD, client_builder, cache).await?;
          ''',
              '''                let requirements_txt =
                              match RequirementsTxt::parse_with_cache(path, &*CWD, client_builder, cache)
                                  .await
                              {
                                  Ok(requirements_txt) => requirements_txt,
                                  Err(_)
                                      if matches!(
                                          source,
                                          RequirementsSource::RequirementsTxtWithUvLockDiagnostic(_)
                                      ) && is_uv_lockfile(path) =>
                                  {
                                      return Err(anyhow::anyhow!(
                                          "The file `{}` appears to be a uv lockfile, but requirements must be specified in `requirements.txt` format",
                                          path.user_display(),
                                      ));
                                  }
                                  Err(err) => return Err(err.into()),
                              };
          ''',
          )
          replace_once(
              specification,
              "\n#[derive(Debug, Default, Clone)]\npub struct GroupsSpecification {\n",
              '''
          /// Returns `true` if the path follows a lockfile naming convention that uv itself emits.
          ///
          /// Callers use this only after requirements parsing fails. Valid requirements files retain
          /// their ordinary meaning even when their names overlap with uv lockfile conventions.
          fn is_uv_lockfile(path: &Path) -> bool {
              if !path.is_file() {
                  return false;
              }

              let Some(file_name) = path.file_name() else {
                  return false;
              };

              if file_name == OsStr::new("uv.lock") {
                  return true;
              }

              if path.extension() != Some(OsStr::new("lock")) {
                  return false;
              }

              let Some(script_name) = path.file_stem().filter(|name| !name.is_empty()) else {
                  return false;
              };
              let script_path = path.with_file_name(script_name);
              let Ok(contents) = fs_err::read(script_path) else {
                  return false;
              };

              Pep723Metadata::parse(&contents).is_ok_and(|metadata| metadata.is_some())
          }

          #[derive(Debug, Default, Clone)]
          pub struct GroupsSpecification {
          ''',
          )

          tests = Path("crates/uv/tests/pip_install/uv_lock_requirements.rs")
          with tests.open("a") as file:
              file.write(r'''

          #[test]
          fn accept_requirements_lock_next_to_pep723_script() -> Result<()> {
              let context = uv_test::test_context!("3.12");
              context.temp_dir.child("action.py").write_str(
                  "# /// script\n# dependencies = []\n# ///\n\nprint('hello')\n",
              )?;
              context.temp_dir.child("action.py.lock").touch()?;

              uv_snapshot!(context.pip_install()
                  .arg("-r")
                  .arg("action.py.lock")
                  .arg("--strict"), @"
              exit_code: 0 (success)
              ----- stderr -----
              warning: Requirements file `action.py.lock` does not contain any dependencies
              Checked in [TIME]
              "
              );

              Ok(())
          }

          #[test]
          fn preserve_missing_uv_lock_error() -> Result<()> {
              let context = uv_test::test_context!("3.12");

              uv_snapshot!(context.pip_install()
                  .arg("-r")
                  .arg("uv.lock")
                  .arg("--strict"), @"
              exit_code: 2 (failure)
              ----- stderr -----
              error: File not found: `uv.lock`
              "
              );

              Ok(())
          }

          #[test]
          fn preserve_constraint_parse_error_for_uv_script_lock() -> Result<()> {
              use predicates::prelude::*;

              let context = uv_test::test_context!("3.12");
              context.temp_dir.child("action.py").write_str(
                  "# /// script\n# dependencies = []\n# ///\n\nprint('hello')\n",
              )?;
              context
                  .lock()
                  .arg("--script")
                  .arg("action.py")
                  .assert()
                  .success();

              context
                  .pip_install()
                  .arg("-c")
                  .arg("action.py.lock")
                  .arg("anyio")
                  .arg("--strict")
                  .assert()
                  .failure()
                  .stderr(predicates::str::contains("Couldn't parse requirement"))
                  .stderr(predicates::str::contains("appears to be a uv lockfile").not());

              Ok(())
          }
          ''')
          PY

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt

      - name: Format and verify experiment fence
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --name-only | sort > "$RUNNER_TEMP/experiment-files.txt"
          cat > "$RUNNER_TEMP/expected-experiment-files.txt" <<'EOF'
          crates/uv-requirements/src/sources.rs
          crates/uv-requirements/src/specification.rs
          crates/uv/tests/pip_install/uv_lock_requirements.rs
          EOF
          diff -u "$RUNNER_TEMP/expected-experiment-files.txt" "$RUNNER_TEMP/experiment-files.txt"
          git diff --check
          git diff --stat

      - name: Install test Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"

      - name: Provision Python 3.12
        run: uv python install 3.12

      - name: Compile affected crates
        run: cargo check -p uv-requirements -p uv

      - name: Run focused producer-backed regression tests
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p uv --test pip_install uv_lock_requirements -- --nocapture

      - name: Verify formatted experiment diff
        if: always()
        run: |
          cargo fmt --all --check
          git diff --check
