name: Fieldwork 457 B2 deferred Windows finalizer

on:
  pull_request:
    paths:
      - .github/workflows/fieldwork-457-b2-deferred-finalizer.yml
      - crates/uv-windows/src/lib.rs
      - crates/uv-windows/src/update_finalizer.rs
      - crates/uv/src/bin/fieldwork_deferred_update_finalizer.rs

permissions:
  contents: read

concurrency:
  group: fieldwork-457-b2-deferred-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deferred-finalizer:
    name: Windows staged finalize-after-exit prototype
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CANDIDATE_HEAD: 77e107dd2665f660c461998bc83174bf26ee7cf6
      CI: 1
    steps:
      - name: Check out exact experiment head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and experiment fence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git merge-base HEAD $env:CANDIDATE_HEAD) -ne $env:CANDIDATE_HEAD) {
            throw 'Experiment does not descend from exact candidate head'
          }
          $expected = @(
            '.github/workflows/fieldwork-457-b2-deferred-finalizer.yml'
            'crates/uv-windows/src/lib.rs'
            'crates/uv-windows/src/update_finalizer.rs'
            'crates/uv/src/bin/fieldwork_deferred_update_finalizer.rs'
          ) | Sort-Object
          $changed = @(git diff --name-only "$env:CANDIDATE_HEAD..HEAD") | Sort-Object
          if (Compare-Object $expected $changed) {
            throw "Unexpected experiment diff. Expected: $($expected -join ', '); actual: $($changed -join ', ')"
          }
          git diff --check "$env:CANDIDATE_HEAD..HEAD"
          New-Item -ItemType Directory -Force -Path receipt | Out-Null
          @(
            "experiment_head=$(git rev-parse HEAD)"
            "candidate_head=$env:CANDIDATE_HEAD"
            "runner=$env:RUNNER_OS"
          ) | Set-Content receipt/identity.txt
          rustc --version | Tee-Object -FilePath receipt/rust-version.txt
          cargo --version | Tee-Object -FilePath receipt/cargo-version.txt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: fieldwork-457-b2-deferred-finalizer
          cache-on-failure: true

      - name: Build and lint prototype
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup component add rustfmt 2>&1 | Tee-Object -FilePath receipt/rustfmt-install.log
          cargo fmt --all --check 2>&1 | Tee-Object -FilePath receipt/fmt.log
          cargo build -p uv --bin fieldwork_deferred_update_finalizer --features self-update 2>&1 |
            Tee-Object -FilePath receipt/build.log

      - name: Run hostile finalization matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:GITHUB_WORKSPACE 'target/debug/fieldwork_deferred_update_finalizer.exe'
          $matrixRoot = Join-Path $env:RUNNER_TEMP 'deferred-finalizer-matrix'
          New-Item -ItemType Directory -Force -Path $matrixRoot | Out-Null

          $parentScript = Join-Path $matrixRoot 'launch-finalizer-parent.ps1'
          @'
          param([Parameter(Mandatory = $true)][string]$ConfigPath)
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -Raw -LiteralPath $ConfigPath | ConvertFrom-Json
          $arguments = @("$PID", [string]$config.canonical, [string]$config.replacement)
          foreach ($argument in @($config.extraArgs)) {
            if ($null -ne $argument -and [string]$argument -ne '') {
              $arguments += [string]$argument
            }
          }
          $child = Start-Process -FilePath ([string]$config.helper) -ArgumentList $arguments `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput ([string]$config.childStdout) `
            -RedirectStandardError ([string]$config.childStderr)
          Set-Content -LiteralPath ([string]$config.childPidPath) -Value $child.Id
          Set-Content -LiteralPath ([string]$config.readyPath) -Value $PID
          $exitRecorded = $false
          while ($true) {
            if (-not $exitRecorded -and $child.HasExited) {
              Set-Content -LiteralPath ([string]$config.childExitPath) -Value $child.ExitCode
              $exitRecorded = $true
            }
            Start-Sleep -Milliseconds 100
          }
          '@ | Set-Content -LiteralPath $parentScript -Encoding utf8

          function Wait-ForFile([string]$path, [string]$description) {
            $deadline = (Get-Date).AddSeconds(20)
            while (-not (Test-Path -LiteralPath $path)) {
              if ((Get-Date) -ge $deadline) {
                throw "Timed out waiting for $description at $path"
              }
              Start-Sleep -Milliseconds 100
            }
          }

          function Start-ParentFinalizer(
            [string]$name,
            [string]$canonical,
            [string]$replacement,
            [string[]]$extraArgs
          ) {
            $readyPath = Join-Path $matrixRoot "$name-parent-ready.txt"
            $finalizerReadyPath = Join-Path $matrixRoot "$name-finalizer-ready.txt"
            $childPidPath = Join-Path $matrixRoot "$name-child-pid.txt"
            $childExitPath = Join-Path $matrixRoot "$name-child-exit.txt"
            $configPath = Join-Path $matrixRoot "$name-config.json"
            $parentStdout = Join-Path $env:GITHUB_WORKSPACE "receipt/$name-parent-stdout.txt"
            $parentStderr = Join-Path $env:GITHUB_WORKSPACE "receipt/$name-parent-stderr.txt"
            $childStdout = Join-Path $env:GITHUB_WORKSPACE "receipt/$name-stdout.txt"
            $childStderr = Join-Path $env:GITHUB_WORKSPACE "receipt/$name-stderr.txt"
            $finalizerArgs = @('--ready-file', $finalizerReadyPath) + @($extraArgs)
            @{
              helper = $helper
              canonical = $canonical
              replacement = $replacement
              extraArgs = $finalizerArgs
              readyPath = $readyPath
              childPidPath = $childPidPath
              childExitPath = $childExitPath
              childStdout = $childStdout
              childStderr = $childStderr
            } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $configPath

            $parent = Start-Process -FilePath 'powershell' -ArgumentList @(
              '-NoProfile',
              '-File',
              $parentScript,
              $configPath
            ) -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $parentStdout -RedirectStandardError $parentStderr

            Wait-ForFile $readyPath "$name parent readiness"
            Wait-ForFile $childPidPath "$name finalizer pid"
            $recordedParentId = [int](Get-Content -Raw -LiteralPath $readyPath)
            if ($recordedParentId -ne $parent.Id) {
              throw "$name parent identity mismatch: launched=$($parent.Id) recorded=$recordedParentId"
            }
            $childPid = [int](Get-Content -Raw -LiteralPath $childPidPath)
            $child = Get-Process -Id $childPid -ErrorAction SilentlyContinue
            [pscustomobject]@{
              Parent = $parent
              Child = $child
              ChildPid = $childPid
              ChildExitPath = $childExitPath
              FinalizerReadyPath = $finalizerReadyPath
            }
          }

          function Stop-ParentAndWait($state) {
            Stop-Process -Id $state.Parent.Id -Force
            $state.Parent.WaitForExit(15000) | Out-Null
            if (-not $state.Parent.HasExited) {
              throw "parent process $($state.Parent.Id) did not exit"
            }
          }

          function Assert-ChildStillRunning($state, [string]$description) {
            if ($null -eq $state.Child) {
              throw "$description exited before a live process handle was acquired"
            }
            if ($state.Child.HasExited) {
              throw "$description exited early with code $($state.Child.ExitCode)"
            }
          }

          function Wait-ForChildExit($state, [int]$expectedCode, [string]$description) {
            if ($null -ne $state.Child) {
              $state.Child.WaitForExit(15000) | Out-Null
              if (-not $state.Child.HasExited) {
                throw "$description: child $($state.ChildPid) did not exit"
              }
              $actualCode = $state.Child.ExitCode
            } else {
              Wait-ForFile $state.ChildExitPath "$description exit code"
              $actualCode = [int](Get-Content -Raw -LiteralPath $state.ChildExitPath)
            }
            if ($actualCode -ne $expectedCode) {
              throw "$description: expected code=$expectedCode actual=$actualCode"
            }
          }

          function Assert-ReadyMarker($state, [string]$description) {
            Wait-ForFile $state.FinalizerReadyPath "$description parent-handle marker"
            $marker = Get-Content -Raw -LiteralPath $state.FinalizerReadyPath
            if ($marker -notmatch "parent_process_id=$($state.Parent.Id)") {
              throw "$description marker does not identify actual parent $($state.Parent.Id): $marker"
            }
            if ($marker -notmatch "finalizer_process_id=$($state.ChildPid)") {
              throw "$description marker does not identify finalizer $($state.ChildPid): $marker"
            }
          }

          # Control 1: staging occurs while old canonical remains available; commit follows parent exit.
          $deferredDir = Join-Path $matrixRoot 'deferred'
          New-Item -ItemType Directory -Force -Path $deferredDir | Out-Null
          $deferredCanonical = Join-Path $deferredDir 'uv.exe'
          $deferredReplacement = Join-Path $matrixRoot 'new-uv.exe'
          Set-Content -NoNewline -Path $deferredCanonical -Value 'old-version'
          Set-Content -NoNewline -Path $deferredReplacement -Value 'new-version'
          $deferred = Start-ParentFinalizer 'deferred' $deferredCanonical $deferredReplacement @()
          Assert-ReadyMarker $deferred 'deferred finalizer'
          Assert-ChildStillRunning $deferred 'deferred finalizer'
          if ((Get-Content -Raw $deferredCanonical) -ne 'old-version') {
            throw 'canonical file changed while actual parent was still running'
          }
          Stop-ParentAndWait $deferred
          Wait-ForChildExit $deferred 0 'deferred finalizer failed'
          if ((Get-Content -Raw $deferredCanonical) -ne 'new-version') {
            throw 'replacement was not committed after actual parent exit'
          }
          if (Get-ChildItem -LiteralPath $deferredDir -Force | Where-Object Name -Match 'update-(stage|backup|journal)') {
            throw 'successful finalization left transaction files behind'
          }

          # Control 2: missing replacement fails before opening/waiting and before touching canonical.
          $missingDir = Join-Path $matrixRoot 'missing'
          New-Item -ItemType Directory -Force -Path $missingDir | Out-Null
          $missingCanonical = Join-Path $missingDir 'uv.exe'
          $missingReplacement = Join-Path $matrixRoot 'does-not-exist.exe'
          Set-Content -NoNewline -Path $missingCanonical -Value 'old-version'
          $missing = Start-ParentFinalizer 'missing' $missingCanonical $missingReplacement @()
          Wait-ForChildExit $missing 42 'missing-stage control returned unexpected result'
          if (Test-Path -LiteralPath $missing.FinalizerReadyPath) {
            throw 'missing-stage control reported parent-handle readiness despite invalid replacement'
          }
          if ($missing.Parent.HasExited) { throw 'missing-stage control unexpectedly waited for parent exit' }
          if ((Get-Content -Raw $missingCanonical) -ne 'old-version') {
            throw 'missing-stage control changed canonical file'
          }
          Stop-ParentAndWait $missing

          # Control 3: ordinary failure after backup restores old canonical.
          $rollbackDir = Join-Path $matrixRoot 'rollback'
          New-Item -ItemType Directory -Force -Path $rollbackDir | Out-Null
          $rollbackCanonical = Join-Path $rollbackDir 'uv.exe'
          $rollbackReplacement = Join-Path $matrixRoot 'rollback-new-uv.exe'
          Set-Content -NoNewline -Path $rollbackCanonical -Value 'old-version'
          Set-Content -NoNewline -Path $rollbackReplacement -Value 'new-version'
          $rollback = Start-ParentFinalizer 'rollback' $rollbackCanonical $rollbackReplacement @('--fail-after-backup')
          Assert-ReadyMarker $rollback 'rollback finalizer'
          Assert-ChildStillRunning $rollback 'rollback finalizer'
          if ((Get-Content -Raw $rollbackCanonical) -ne 'old-version') {
            throw 'rollback control changed canonical file before actual parent exit'
          }
          Stop-ParentAndWait $rollback
          Wait-ForChildExit $rollback 42 'rollback control returned unexpected result'
          if ((Get-Content -Raw $rollbackCanonical) -ne 'old-version') {
            throw 'ordinary commit failure did not restore old canonical file'
          }
          if (Get-ChildItem -LiteralPath $rollbackDir -Force | Where-Object Name -Match 'update-(stage|backup|journal)') {
            throw 'rollback left transaction files behind'
          }

          @{
            authority = 'finalizer child acquires and owns handle to actual parent before readiness marker'
            parentContract = 'updater must wait for finalizer readiness marker before exiting'
            fastExitReceipt = 'parent records child exit code when invalid input fails before outer handle acquisition'
            deferredCommit = 'pass'
            missingStageFailsBeforeCanonicalMutation = 'pass'
            ordinaryCommitFailureRollsBack = 'pass'
          } | ConvertTo-Json | Set-Content receipt/matrix.json

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-457-b2-deferred-finalizer
          path: receipt/
          if-no-files-found: error
          retention-days: 30
