name: fieldwork-309-publish-cross-source-variant

on:
  push:
    branches:
      - fix/hide-incomplete-managed-python-installations-cross-source
    paths:
      - '.github/workflows/fieldwork-309-publish-cross-source-variant.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: github.actor == 'teamleaderleo'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8525cfc69e561adc0b4f71c2c1f02ae457b37b7c"

      - name: Apply proven Windows discovery prototype
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fieldwork-309.patch <<'PATCH'
          diff --git a/crates/uv-python/src/discovery.rs b/crates/uv-python/src/discovery.rs
          index 39e0b97..7b57855 100644
          --- a/crates/uv-python/src/discovery.rs
          +++ b/crates/uv-python/src/discovery.rs
          @@ -29,7 +29,7 @@ use crate::implementation::ImplementationName;
           use crate::installation::{PythonInstallation, PythonInstallationKey};
           use crate::interpreter::Error as InterpreterError;
           use crate::interpreter::{StatusCodeError, UnexpectedResponseError};
          -use crate::managed::{ManagedPythonInstallations, PythonMinorVersionLink};
          +use crate::managed::{ManagedPythonInstallation, ManagedPythonInstallations, PythonMinorVersionLink};
           #[cfg(windows)]
           use crate::microsoft_store::find_microsoft_store_pythons;
           use crate::python_version::python_build_versions_from_env;
          @@ -265,6 +265,9 @@ pub enum Error {
               #[error("Failed to discover managed Python installations")]
               ManagedPython(#[from] crate::managed::Error),
           
          +    #[error("Managed Python installation at `{}` is still being finalized", _0.user_display())]
          +    ManagedPythonInstallationInProgress(PathBuf),
          +
               /// An error was encountered when inspecting a virtual environment.
               #[error(transparent)]
               VirtualEnv(#[from] crate::virtualenv::Error),
          @@ -792,20 +795,26 @@ fn python_installation_from_executable(
               path: PathBuf,
               cache: &Cache,
           ) -> Result<PythonInstallation, Error> {
          -    Interpreter::query(&path, cache)
          -        .map(|interpreter| PythonInstallation {
          -            source,
          -            interpreter,
          -        })
          -        .inspect(|installation| {
          -            debug!(
          -                "Found `{}` at `{}` ({source})",
          -                installation.key(),
          -                path.display()
          -            );
          -        })
          -        .map_err(|err| Error::Query(Box::new(err), path, source))
          -        .inspect_err(|err| debug!("{err}"))
          +    let interpreter = Interpreter::query(&path, cache)
          +        .map_err(|err| Error::Query(Box::new(err), path.clone(), source))
          +        .inspect_err(|err| debug!("{err}"))?;
          +
          +    if ManagedPythonInstallation::interpreter_is_in_progress(&interpreter)? {
          +        let root = interpreter.sys_base_prefix().to_path_buf();
          +        debug!(
          +            "Skipping incomplete managed Python installation at `{}` discovered from {source}",
          +            root.user_display()
          +        );
          +        return Err(Error::ManagedPythonInstallationInProgress(root));
          +    }
          +
          +    let installation = PythonInstallation { source, interpreter };
          +    debug!(
          +        "Found `{}` at `{}` ({source})",
          +        installation.key(),
          +        path.display()
          +    );
          +    Ok(installation)
           }
           
           /// Convert Python executables into installations using the given query strategy.
          @@ -993,6 +1002,13 @@ impl Error {
                               }
                           }
                       },
          +            Self::ManagedPythonInstallationInProgress(path) => {
          +                trace!(
          +                    "Skipping incomplete managed Python installation at {}",
          +                    path.display()
          +                );
          +                false
          +            }
                       Self::VirtualEnv(VirtualEnvError::MissingPyVenvCfg(path)) => {
                           trace!("Skipping broken virtualenv at {}", path.display());
                           false
          diff --git a/crates/uv-python/src/managed.rs b/crates/uv-python/src/managed.rs
          index 10c674a..85c1b62 100644
          --- a/crates/uv-python/src/managed.rs
          +++ b/crates/uv-python/src/managed.rs
          @@ -383,33 +383,37 @@ impl ManagedPythonInstallation {
                   })
               }
           
          -    /// Try to create a [`ManagedPythonInstallation`] from an [`Interpreter`].
          -    ///
          -    /// Returns `None` if the interpreter is not a managed installation.
          -    pub fn try_from_interpreter(interpreter: &Interpreter) -> Option<Self> {
          +    /// Return the managed installation path for an interpreter, if it belongs to uv's managed
          +    /// root.
          +    fn path_from_interpreter(interpreter: &Interpreter) -> Option<PathBuf> {
                   let managed_root = ManagedPythonInstallations::from_settings(None).ok()?;
                   let root = managed_root.absolute_root().ok()?;
           
                   // Canonicalize both paths to handle Windows path format differences
          -        // (e.g., \\?\ prefix, different casing, junction vs actual path).
          -        // Fall back to the original path if canonicalization fails (e.g., target doesn't exist).
          +        // (e.g., \\?\ prefix, different casing, junction vs actual path).
                   let sys_base_prefix = dunce::canonicalize(interpreter.sys_base_prefix())
                       .unwrap_or_else(|_| interpreter.sys_base_prefix().to_path_buf());
                   let root = dunce::canonicalize(&root).unwrap_or(root);
          -
          -        // Verify the interpreter's base prefix is within the managed root
                   let suffix = sys_base_prefix.strip_prefix(&root).ok()?;
          -
                   let first_component = suffix.components().next()?;
                   let name = first_component.as_os_str().to_str()?;
          -
          -        // Verify it's a valid installation key
                   PythonInstallationKey::from_str(name).ok()?;
          +        Some(root.join(name))
          +    }
           
          -        // Construct the installation from the path within the managed root. Refuse
          -        // marker-bearing (or unreadable) paths here too: this reconstruction path can be reached
          -        // from an already-discovered interpreter without going through `find_all()`.
          -        let path = root.join(name);
          +    /// Return whether an interpreter belongs to a published but incomplete managed installation.
          +    pub(crate) fn interpreter_is_in_progress(interpreter: &Interpreter) -> Result<bool, Error> {
          +        let Some(path) = Self::path_from_interpreter(interpreter) else {
          +            return Ok(false);
          +        };
          +        installation_is_in_progress(&path)
          +    }
          +
          +    /// Try to create a [`ManagedPythonInstallation`] from an [`Interpreter`].
          +    ///
          +    /// Returns `None` if the interpreter is not a managed installation.
          +    pub fn try_from_interpreter(interpreter: &Interpreter) -> Option<Self> {
          +        let path = Self::path_from_interpreter(interpreter)?;
                   if installation_is_in_progress(&path).ok()? {
                       return None;
                   }
          PATCH
          git apply --check /tmp/fieldwork-309.patch
          git apply /tmp/fieldwork-309.patch
          cargo fmt --all
          git diff --check

      - name: Publish product-only variant
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fieldwork-309-publish-cross-source-variant.yml
          git config user.name "teamleaderleo"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add crates/uv-python/src/discovery.rs crates/uv-python/src/managed.rs .github/workflows/fieldwork-309-publish-cross-source-variant.yml
          git commit -m "fix: hide incomplete managed Python across discovery sources"
          git push origin HEAD:fix/hide-incomplete-managed-python-installations-cross-source
