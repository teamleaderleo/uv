name: Fieldwork wheel cache crash consistency

on:
  pull_request:
    paths:
      - 'fieldwork/wheel-cache-crash-consistency/**'
      - '.github/workflows/fieldwork-wheel-cache-crash-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CURRENT_SOURCE_HEAD: 79bbface771210df216b738e9bdc7df95e5a9e6b
    steps:
      - name: Check out exact owned carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out exact current uv source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/upstream-79bbface
          path: uv-current
          persist-credentials: false

      - name: Verify exact identities and probe syntax
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C uv-current rev-parse HEAD)" = "$CURRENT_SOURCE_HEAD"
          python3 -m py_compile \
            fieldwork/wheel-cache-crash-consistency/crash_model.py \
            fieldwork/wheel-cache-crash-consistency/repro_corrupt_archive.py \
            fieldwork/wheel-cache-crash-consistency/repro_missing_local_archive.py
          git -C uv-current apply --check \
            ../fieldwork/wheel-cache-crash-consistency/missing-local-archive-candidate.patch

      - name: Execute bounded crash-state model
        run: |
          python3 fieldwork/wheel-cache-crash-consistency/crash_model.py \
            > fieldwork-wheel-cache-crash-model.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('fieldwork-wheel-cache-crash-model.json').read_text())
          rows = receipt['cases']
          assert any(row['unsafe_trust'] for row in rows)
          assert any(
              row['protocol'] == 'verify-contents' and row['directory_visible']
              for row in rows
          )
          PY

      - name: Build exact current baseline uv CLI
        working-directory: uv-current
        run: cargo build --locked --bin uv

      - name: Execute current-head extracted-wheel corruption probe
        run: |
          set +e
          python3 fieldwork/wheel-cache-crash-consistency/repro_corrupt_archive.py \
            --uv uv-current/target/debug/uv \
            | tee fieldwork-wheel-cache-corruption.json
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0

      - name: Execute current-head missing local archive baseline
        run: |
          set +e
          python3 fieldwork/wheel-cache-crash-consistency/repro_missing_local_archive.py \
            --uv uv-current/target/debug/uv \
            | tee fieldwork-wheel-cache-missing-local-archive-baseline.json
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path('fieldwork-wheel-cache-missing-local-archive-baseline.json').read_text()
          )
          assert receipt['outcome'] == 'bug-reproduced', receipt
          assert receipt['source_wheel_unchanged'] is True, receipt
          assert receipt['stale_pointer_survived'] is True, receipt
          PY

      - name: Install rustfmt for pinned toolchain
        run: rustup component add rustfmt

      - name: Apply bounded pointer archive candidate
        run: |
          git -C uv-current apply \
            ../fieldwork/wheel-cache-crash-consistency/missing-local-archive-candidate.patch
          git -C uv-current diff --check
          (cd uv-current && cargo fmt --all -- --check)
          git -C uv-current diff --binary \
            > fieldwork-wheel-cache-missing-archive-tested.patch
          git -C uv-current diff --name-only \
            > fieldwork-wheel-cache-missing-archive-files.txt
          test "$(cat fieldwork-wheel-cache-missing-archive-files.txt)" = "$(printf '%s\n' \
            crates/uv-distribution/src/archive.rs \
            crates/uv-distribution/src/distribution_database.rs \
            crates/uv-installer/src/plan.rs)"

      - name: Build current-head candidate uv CLI
        working-directory: uv-current
        run: cargo build --locked --bin uv

      - name: Execute current-head missing local archive candidate
        run: |
          set +e
          python3 fieldwork/wheel-cache-crash-consistency/repro_missing_local_archive.py \
            --uv uv-current/target/debug/uv \
            | tee fieldwork-wheel-cache-missing-local-archive-candidate.json
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path('fieldwork-wheel-cache-missing-local-archive-candidate.json').read_text()
          )
          assert receipt['outcome'] == 'recovered', receipt
          assert receipt['source_wheel_unchanged'] is True, receipt
          assert receipt['stale_pointer_survived'] is False, receipt
          PY

      - name: Run focused crate tests
        working-directory: uv-current
        run: |
          cargo test --locked -p uv-distribution archive::tests
          cargo test --locked -p uv-installer plan::tests

      - name: Upload exact receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: fieldwork-wheel-cache-crash-consistency
          path: |
            fieldwork-wheel-cache-crash-model.json
            fieldwork-wheel-cache-corruption.json
            fieldwork-wheel-cache-missing-local-archive-baseline.json
            fieldwork-wheel-cache-missing-local-archive-candidate.json
            fieldwork-wheel-cache-missing-archive-tested.patch
            fieldwork-wheel-cache-missing-archive-files.txt
          if-no-files-found: warn
          retention-days: 30
