name: Fieldwork 457 B2 repaired negative controls

on:
  pull_request:
    paths:
      - .github/workflows/fieldwork-457-b2-negative-controls-v2.yml

permissions:
  contents: read

jobs:
  negative-controls:
    name: Windows exact old/candidate executable boundary
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CANDIDATE_HEAD: 77e107dd2665f660c461998bc83174bf26ee7cf6
      CANDIDATE_BASE: ec8ad5b7c697b9cbbb8a65c8de00fdb461f2010b
      CI: 1
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify identity and carrier fence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git merge-base HEAD $env:CANDIDATE_HEAD) -ne $env:CANDIDATE_HEAD) {
            throw 'Carrier does not descend from exact candidate head'
          }
          $changed = @(git diff --name-only "$env:CANDIDATE_HEAD..HEAD")
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/fieldwork-457-b2-negative-controls-v2.yml') {
            throw "Unexpected carrier diff: $($changed -join ', ')"
          }
          git diff --check "$env:CANDIDATE_HEAD..HEAD"
          New-Item -ItemType Directory -Force -Path receipt | Out-Null
          @(
            "carrier_head=$(git rev-parse HEAD)"
            "candidate_head=$env:CANDIDATE_HEAD"
            "candidate_base=$env:CANDIDATE_BASE"
            "runner=$env:RUNNER_OS"
          ) | Set-Content receipt/identity.txt
          rustc --version | Tee-Object -FilePath receipt/rust-version.txt
          cargo --version | Tee-Object -FilePath receipt/cargo-version.txt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: fieldwork-457-b2-negative-controls-v2
          cache-on-failure: true

      - name: Inject candidate actual-executable control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'crates/uv/src/commands/self_update.rs'
          $text = [IO.File]::ReadAllText($path)
          $test = @'

              #[cfg(windows)]
              #[tokio::test]
              async fn fieldwork_candidate_cancellation_preserves_actual_current_executable() {
                  let temp_dir = TempDir::new().unwrap();
                  let installer_path = temp_dir.path().join("installer.ps1");
                  let install_prefix = temp_dir.path().join("install-prefix");
                  let started_path = temp_dir.path().join("installer-started");
                  let finish_path = temp_dir.path().join("finish-installer");
                  let current_executable = std::env::current_exe().unwrap();
                  let mut previous_name = current_executable.as_os_str().to_os_string();
                  previous_name.push(".previous.exe");
                  let previous_path = PathBuf::from(previous_name);
                  let _ = fs_err::remove_file(&previous_path);

                  fs_err::write(
                      &installer_path,
                      format!(
                          "New-Item -ItemType File -Force -Path '{}' | Out-Null\nwhile (-not (Test-Path -LiteralPath '{}')) {{ Start-Sleep -Milliseconds 10 }}\n",
                          started_path.display(),
                          finish_path.display(),
                      ),
                  )
                  .unwrap();

                  let task_installer_path = installer_path.clone();
                  let task_install_prefix = install_prefix.clone();
                  let task = tokio::spawn(async move {
                      execute_official_installer(
                          &task_installer_path,
                          &task_install_prefix,
                          true,
                          &Pep440Version::new([1, 2, 3]),
                          None,
                          None,
                      )
                      .await
                  });

                  for _ in 0..600 {
                      if started_path.exists() || task.is_finished() {
                          break;
                      }
                      tokio::time::sleep(Duration::from_millis(50)).await;
                  }
                  assert!(started_path.exists(), "installer should have started within 30 seconds");

                  task.abort();
                  let join_error = task.await.expect_err("task should be cancelled");
                  assert!(join_error.is_cancelled(), "task should report completed cancellation");
                  assert!(
                      current_executable.exists(),
                      "candidate must keep the actual running executable at its canonical path"
                  );
                  assert!(
                      !previous_path.exists(),
                      "candidate must not pre-rename the actual running executable"
                  );
                  fs_err::write(&finish_path, "finish").unwrap();
              }
          '@
          $index = $text.LastIndexOf("`n}")
          if ($index -lt 0) { throw 'Could not find candidate test-module close' }
          [IO.File]::WriteAllText($path, $text.Insert($index, $test))

      - name: Run candidate actual-executable control
        id: candidate
        continue-on-error: true
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'candidate-target-v2'
          cargo test -p uv --lib --features self-update fieldwork_candidate_cancellation_preserves_actual_current_executable -- --nocapture 2>&1 |
            Tee-Object -FilePath receipt/candidate-actual-executable.log

      - name: Prepare exact old-base worktree and controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git checkout -- crates/uv/src/commands/self_update.rs
          $baseDir = Join-Path $env:RUNNER_TEMP 'uv-old-base-v2'
          git worktree add --detach $baseDir $env:CANDIDATE_BASE
          $path = Join-Path $baseDir 'crates/uv/src/commands/self_update.rs'
          $text = [IO.File]::ReadAllText($path)
          $tests = @'

              #[cfg(windows)]
              #[tokio::test]
              async fn fieldwork_old_head_public_fixture_assertion_still_passes() {
                  let temp_dir = TempDir::new().unwrap();
                  let installer_path = temp_dir.path().join("installer.ps1");
                  let install_prefix = temp_dir.path().join("install-prefix");
                  let original_path = temp_dir.path().join("uv.exe");
                  let started_path = temp_dir.path().join("installer-started");
                  let finish_path = temp_dir.path().join("finish-installer");
                  let current_executable = std::env::current_exe().unwrap();
                  let mut previous_name = current_executable.as_os_str().to_os_string();
                  previous_name.push(".previous.exe");
                  let previous_path = PathBuf::from(previous_name);
                  let _ = fs_err::remove_file(&previous_path);

                  fs_err::write(&original_path, "old uv").unwrap();
                  fs_err::write(
                      &installer_path,
                      format!(
                          "New-Item -ItemType File -Force -Path '{}' | Out-Null\nwhile (-not (Test-Path -LiteralPath '{}')) {{ Start-Sleep -Milliseconds 10 }}\n",
                          started_path.display(),
                          finish_path.display(),
                      ),
                  )
                  .unwrap();

                  let task_installer_path = installer_path.clone();
                  let task_install_prefix = install_prefix.clone();
                  let task = tokio::spawn(async move {
                      execute_official_installer(
                          &task_installer_path,
                          &task_install_prefix,
                          true,
                          &Pep440Version::new([1, 2, 3]),
                          None,
                      )
                      .await
                  });

                  for _ in 0..600 {
                      if started_path.exists() || task.is_finished() {
                          break;
                      }
                      tokio::time::sleep(Duration::from_millis(50)).await;
                  }
                  assert!(started_path.exists(), "installer should have started within 30 seconds");

                  task.abort();
                  let join_error = task.await.expect_err("task should be cancelled");
                  assert!(join_error.is_cancelled(), "task should report completed cancellation");
                  assert!(
                      original_path.exists(),
                      "the public test's unrelated fixture remains present on the broken old implementation"
                  );

                  if previous_path.exists() && !current_executable.exists() {
                      fs_err::rename(&previous_path, &current_executable).unwrap();
                  }
                  fs_err::write(&finish_path, "finish").unwrap();
              }

              #[cfg(windows)]
              #[tokio::test]
              async fn fieldwork_old_head_cancellation_displaces_actual_current_executable() {
                  let temp_dir = TempDir::new().unwrap();
                  let installer_path = temp_dir.path().join("installer.ps1");
                  let install_prefix = temp_dir.path().join("install-prefix");
                  let started_path = temp_dir.path().join("installer-started");
                  let finish_path = temp_dir.path().join("finish-installer");
                  let current_executable = std::env::current_exe().unwrap();
                  let mut previous_name = current_executable.as_os_str().to_os_string();
                  previous_name.push(".previous.exe");
                  let previous_path = PathBuf::from(previous_name);
                  let _ = fs_err::remove_file(&previous_path);

                  fs_err::write(
                      &installer_path,
                      format!(
                          "New-Item -ItemType File -Force -Path '{}' | Out-Null\nwhile (-not (Test-Path -LiteralPath '{}')) {{ Start-Sleep -Milliseconds 10 }}\n",
                          started_path.display(),
                          finish_path.display(),
                      ),
                  )
                  .unwrap();

                  let task_installer_path = installer_path.clone();
                  let task_install_prefix = install_prefix.clone();
                  let task = tokio::spawn(async move {
                      execute_official_installer(
                          &task_installer_path,
                          &task_install_prefix,
                          true,
                          &Pep440Version::new([1, 2, 3]),
                          None,
                      )
                      .await
                  });

                  for _ in 0..600 {
                      if started_path.exists() || task.is_finished() {
                          break;
                      }
                      tokio::time::sleep(Duration::from_millis(50)).await;
                  }
                  assert!(started_path.exists(), "installer should have started within 30 seconds");

                  task.abort();
                  let join_error = task.await.expect_err("task should be cancelled");
                  assert!(join_error.is_cancelled(), "task should report completed cancellation");
                  assert!(
                      !current_executable.exists(),
                      "old implementation should lose the canonical executable path during interruption"
                  );
                  assert!(
                      previous_path.exists(),
                      "old implementation should retain the running executable under .previous.exe"
                  );

                  fs_err::rename(&previous_path, &current_executable).unwrap();
                  fs_err::write(&finish_path, "finish").unwrap();
              }
          '@
          $index = $text.LastIndexOf("`n}")
          if ($index -lt 0) { throw 'Could not find old-base test-module close' }
          [IO.File]::WriteAllText($path, $text.Insert($index, $tests))
          "base_worktree=$baseDir" | Set-Content receipt/base-worktree.txt

      - name: Run old-base public-fixture negative control
        id: weak
        continue-on-error: true
        shell: pwsh
        run: |
          $baseDir = Join-Path $env:RUNNER_TEMP 'uv-old-base-v2'
          Push-Location $baseDir
          try {
            $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'old-target-v2'
            cargo test -p uv --lib --features self-update fieldwork_old_head_public_fixture_assertion_still_passes -- --nocapture 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE/receipt/old-public-fixture.log"
          } finally {
            Pop-Location
          }

      - name: Run old-base actual-executable control
        id: oldactual
        continue-on-error: true
        shell: pwsh
        run: |
          $baseDir = Join-Path $env:RUNNER_TEMP 'uv-old-base-v2'
          Push-Location $baseDir
          try {
            $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'old-target-v2'
            cargo test -p uv --lib --features self-update fieldwork_old_head_cancellation_displaces_actual_current_executable -- --nocapture 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE/receipt/old-actual-executable.log"
          } finally {
            Pop-Location
          }

      - name: Assemble exact receipt
        if: always()
        shell: pwsh
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          WEAK_OUTCOME: ${{ steps.weak.outcome }}
          OLD_ACTUAL_OUTCOME: ${{ steps.oldactual.outcome }}
        run: |
          @{
            carrierHead = (git rev-parse HEAD)
            candidateHead = $env:CANDIDATE_HEAD
            candidateBase = $env:CANDIDATE_BASE
            platform = 'windows-latest'
            candidateActualExecutable = $env:CANDIDATE_OUTCOME
            oldPublicFixture = $env:WEAK_OUTCOME
            oldActualExecutable = $env:OLD_ACTUAL_OUTCOME
          } | ConvertTo-Json | Set-Content receipt/receipt.json

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-457-b2-negative-controls-v2
          path: receipt/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce expected control outcomes
        if: always()
        shell: pwsh
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          WEAK_OUTCOME: ${{ steps.weak.outcome }}
          OLD_ACTUAL_OUTCOME: ${{ steps.oldactual.outcome }}
        run: |
          if ($env:CANDIDATE_OUTCOME -ne 'success') { throw "Candidate control: $env:CANDIDATE_OUTCOME" }
          if ($env:WEAK_OUTCOME -ne 'success') { throw "Old public-fixture control: $env:WEAK_OUTCOME" }
          if ($env:OLD_ACTUAL_OUTCOME -ne 'success') { throw "Old actual-executable control: $env:OLD_ACTUAL_OUTCOME" }
