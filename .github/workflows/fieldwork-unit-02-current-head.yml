name: Fieldwork unit 02 current-head materialization

on:
  push:
    branches:
      - fieldwork/02-current-head-materialization
    paths:
      - .github/workflows/fieldwork-unit-02-current-head.yml
      - scripts/fieldwork/apply-unit-02-busybox-realpath.py
      - scripts/fieldwork/unit-02-relocatable-launcher-matrix.sh

permissions:
  contents: write

concurrency:
  group: fieldwork-unit-02-materialization
  cancel-in-progress: true

jobs:
  materialize-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact carrier fence
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BASE: 79bbface771210df216b738e9bdc7df95e5a9e6b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE"...HEAD | sort > "${{ runner.temp }}/carrier-files.txt"
          cat > "${{ runner.temp }}/expected-carrier-files.txt" <<'EOF'
          .github/workflows/fieldwork-unit-02-current-head.yml
          scripts/fieldwork/apply-unit-02-busybox-realpath.py
          scripts/fieldwork/unit-02-relocatable-launcher-matrix.sh
          EOF
          diff -u "${{ runner.temp }}/expected-carrier-files.txt" "${{ runner.temp }}/carrier-files.txt"
          python -m py_compile scripts/fieldwork/apply-unit-02-busybox-realpath.py
          /bin/sh -n scripts/fieldwork/unit-02-relocatable-launcher-matrix.sh
          test -z "$(git status --porcelain)"
          printf 'carrier_sha=%s\nbase_sha=%s\n' "$EXPECTED_SHA" "$EXPECTED_BASE"

      - name: Generate exact source-only candidate
        run: |
          set -euo pipefail
          python scripts/fieldwork/apply-unit-02-busybox-realpath.py \
            | tee "${{ runner.temp }}/candidate-counts.txt"
          git diff --check
          git diff -- \
            crates/uv-install-wheel/src/wheel.rs \
            crates/uv-virtualenv/src/virtualenv.rs \
            crates/uv/src/commands/project/run.rs \
            > "${{ runner.temp }}/candidate.patch"
          test -s "${{ runner.temp }}/candidate.patch"
          git diff --name-only | sort > "${{ runner.temp }}/changed-files.txt"
          cat > "${{ runner.temp }}/expected-files.txt" <<'EOF'
          crates/uv-install-wheel/src/wheel.rs
          crates/uv-virtualenv/src/virtualenv.rs
          crates/uv/src/commands/project/run.rs
          EOF
          diff -u "${{ runner.temp }}/expected-files.txt" "${{ runner.temp }}/changed-files.txt"
          ! grep -F 'realpath --' crates/uv-install-wheel/src/wheel.rs
          ! grep -F 'realpath --' crates/uv-virtualenv/src/virtualenv.rs
          ! grep -F 'realpath --' crates/uv/src/commands/project/run.rs

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Compile affected crates
        run: cargo check -p uv-install-wheel -p uv-virtualenv -p uv

      - name: Run target-native shebang tests
        run: cargo test -p uv-install-wheel format_shebang

      - name: Run GNU coreutils behavior matrix
        env:
          RESULT: ${{ runner.temp }}/unit-02-results.txt
        run: |
          set -euo pipefail
          /bin/sh scripts/fieldwork/unit-02-relocatable-launcher-matrix.sh gnu | tee "$RESULT"

      - name: Run Alpine BusyBox behavior matrix
        env:
          RESULT: ${{ runner.temp }}/unit-02-results.txt
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/source:ro" \
            alpine:3.22 \
            /bin/sh /source/scripts/fieldwork/unit-02-relocatable-launcher-matrix.sh busybox \
            | tee -a "$RESULT"

      - name: Verify result markers
        env:
          RESULT: ${{ runner.temp }}/unit-02-results.txt
        run: |
          set -euo pipefail
          grep -F 'UNIT_02_MATRIX=gnu' "$RESULT"
          grep -F 'UNIT_02_MATRIX=busybox' "$RESULT"
          grep -F 'UNIT_02_PATCH=realpath:5,dirname:7' "${{ runner.temp }}/candidate-counts.txt"

      - name: Commit tested source blobs to carrier
        env:
          SOURCE_PARENT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p scripts/fieldwork
          cat > scripts/fieldwork/unit-02-materialization-receipt.txt <<EOF
          source_parent=$SOURCE_PARENT
          workflow_run=$RUN_ID
          workflow_attempt=$RUN_ATTEMPT
          public_base=79bbface771210df216b738e9bdc7df95e5a9e6b
          candidate_counts=realpath:5,dirname:7
          result=passed
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/uv-install-wheel/src/wheel.rs \
            crates/uv-virtualenv/src/virtualenv.rs \
            crates/uv/src/commands/project/run.rs \
            scripts/fieldwork/unit-02-materialization-receipt.txt
          git commit -m "Materialize tested unit 02 source blobs [skip ci]"
          git push origin HEAD:fieldwork/02-current-head-materialization

      - name: Retain exact source files, patch, and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-02-current-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crates/uv-install-wheel/src/wheel.rs
            crates/uv-virtualenv/src/virtualenv.rs
            crates/uv/src/commands/project/run.rs
            scripts/fieldwork/unit-02-materialization-receipt.txt
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate-counts.txt
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/unit-02-results.txt
          if-no-files-found: warn
          retention-days: 14
