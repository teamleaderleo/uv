name: Fieldwork finalize simple stub candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-stub-scaffold-current
          fetch-depth: 0

      - name: Apply final source refinement and rerun focused tests once
        shell: bash
        run: |
          set -euo pipefail
          target=crates/uv/src/commands/project/init.rs
          if grep -q 'ProjectBuildBackend::Maturin | ProjectBuildBackend::Scikit => {' "$target"; then
            echo 'Final candidate refinement is already materialized.'
            cargo test --package uv --test it simple_stub -- --nocapture
            exit 0
          fi

          curl -fsSL \
            'https://api.github.com/repos/teamleaderleo/linux-fieldwork/contents/investigations/uv-stubs-backend-scope/product/uv_candidate_final_refine.py?ref=research%2F487-uv-simple-stub-candidate' \
            -o "$RUNNER_TEMP/final_refine.json"
          python - "$RUNNER_TEMP/final_refine.json" "$RUNNER_TEMP/uv_candidate_final_refine.py" <<'PY'
          import base64
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(payload['content']))
          PY

          python "$RUNNER_TEMP/uv_candidate_final_refine.py" "$target"
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt
          cargo fmt --all
          git diff --check
          cargo test --package uv --test it simple_stub -- --nocapture
          git diff --stat

          git config user.name 'linux-fieldwork-bot'
          git config user.email '13091533+teamleaderleo@users.noreply.github.com'
          git add "$target"
          git commit -m 'Finalize simple stub scaffold implementation'
          git push origin HEAD:fix/simple-stub-scaffold-current
