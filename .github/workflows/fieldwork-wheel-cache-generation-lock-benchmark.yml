name: Fieldwork wheel cache generation lock benchmark

on:
  pull_request:
    paths:
      - 'fieldwork/wheel-cache-generation-lock/benchmark_generation_lock.py'
      - 'fieldwork/wheel-cache-generation-lock/apply_generation_lock.py'
      - '.github/workflows/fieldwork-wheel-cache-generation-lock-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CURRENT_SOURCE_HEAD: 0cf7c4561b7c7159ab9479719a12573d0a6aa3bb
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out exact uv source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/upstream-0cf7c456
          path: uv-current
          persist-credentials: false

      - name: Verify identities and benchmark syntax
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C uv-current rev-parse HEAD)" = "$CURRENT_SOURCE_HEAD"
          python3 -m py_compile \
            fieldwork/wheel-cache-generation-lock/apply_generation_lock.py \
            fieldwork/wheel-cache-generation-lock/benchmark_generation_lock.py

      - name: Build exact baseline
        working-directory: uv-current
        run: cargo build --locked --bin uv

      - name: Preserve baseline binary
        run: |
          cp uv-current/target/debug/uv uv-baseline
          chmod +x uv-baseline
          ./uv-baseline --version

      - name: Apply exact lock candidate
        run: |
          python3 fieldwork/wheel-cache-generation-lock/apply_generation_lock.py \
            uv-current
          git -C uv-current diff --check
          test "$(git -C uv-current diff --name-only)" = \
            "crates/uv-distribution/src/distribution_database.rs"
          rustup component add rustfmt
          (cd uv-current && cargo fmt --all)
          (cd uv-current && cargo fmt --all -- --check)

      - name: Build candidate
        working-directory: uv-current
        run: cargo build --locked --bin uv

      - name: Execute balanced warm-lock comparison
        run: |
          python3 fieldwork/wheel-cache-generation-lock/benchmark_generation_lock.py \
            --baseline-uv uv-baseline \
            --candidate-uv uv-current/target/debug/uv \
            --repeats 6 \
            --concurrency 1 4 8 \
            | tee fieldwork-wheel-cache-generation-lock-benchmark.json

      - name: Validate benchmark receipt
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path('fieldwork-wheel-cache-generation-lock-benchmark.json').read_text()
          )
          assert receipt['evidence_class'] == 'target-executed-balanced-warm-lock-comparison'
          assert receipt['threshold_enforced'] is False
          assert [case['concurrency'] for case in receipt['cases']] == [1, 4, 8]
          expected_order = [
              ['baseline', 'candidate'],
              ['candidate', 'baseline'],
              ['baseline', 'candidate'],
              ['candidate', 'baseline'],
              ['baseline', 'candidate'],
              ['candidate', 'baseline'],
          ]
          for case in receipt['cases']:
              assert case['repeats'] == 6, case
              assert case['execution_order'] == expected_order, case
              assert case['baseline']['median_ms'] > 0, case
              assert case['candidate']['median_ms'] > 0, case
              assert case['candidate_to_baseline_median_ratio'] > 0, case
              for label in ['baseline', 'candidate']:
                  assert len(case[label]['samples']) == 6, case
                  for sample in case[label]['samples']:
                      assert all(sample['cache_hits']), sample
          PY

      - name: Upload benchmark receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: fieldwork-wheel-cache-generation-lock-benchmark
          path: fieldwork-wheel-cache-generation-lock-benchmark.json
          if-no-files-found: warn
          retention-days: 30
