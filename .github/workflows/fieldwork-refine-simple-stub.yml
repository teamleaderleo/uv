name: Fieldwork refine simple stub candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-stub-scaffold-current
          fetch-depth: 0

      - name: Refine source and rerun focused tests once
        shell: bash
        run: |
          set -euo pipefail
          target=crates/uv/src/commands/project/init.rs
          if grep -q 'let flit_requirement = if simple_stub' "$target"; then
            echo 'Candidate source is already refined.'
            cargo test --package uv --test it simple_stub -- --nocapture
            exit 0
          fi

          curl -fsSL \
            https://raw.githubusercontent.com/teamleaderleo/linux-fieldwork/71bdeed1fbe17f07036055fc0f2bd529ca027dc1/investigations/uv-stubs-backend-scope/product/uv_candidate_cleanup_transform.py \
            -o "$RUNNER_TEMP/uv_candidate_cleanup_transform.py"

          python "$RUNNER_TEMP/uv_candidate_cleanup_transform.py" "$target"
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt
          cargo fmt --all
          git diff --check
          cargo test --package uv --test it simple_stub -- --nocapture
          git diff --stat

          git config user.name 'linux-fieldwork-bot'
          git config user.email '13091533+teamleaderleo@users.noreply.github.com'
          git add "$target"
          git commit -m 'Refine simple stub scaffold implementation'
          git push origin HEAD:fix/simple-stub-scaffold-current
