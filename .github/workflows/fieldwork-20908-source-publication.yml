name: Fieldwork 20908 source publication

on:
  pull_request:
    branches:
      - fieldwork/20908-source-publication-base
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_BASE: 507230998c9541d67814b57463ac00e454ff6991
    steps:
      - name: Check out carrier
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify carrier boundary
        run: |
          set -euo pipefail
          base_ref="origin/${{ github.event.pull_request.base.ref }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only "$base_ref...$head_sha" | sort)
          expected=(scripts/fieldwork/20908-source.patch)
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")
          cp scripts/fieldwork/20908-source.patch "$RUNNER_TEMP/source.patch"

      - name: Generate exact source
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_BASE"
          git apply --check "$RUNNER_TEMP/source.patch"
          git apply "$RUNNER_TEMP/source.patch"
          rustup component add rustfmt clippy
          cargo fmt --all
          test "$(git diff --name-only)" = "crates/uv-distribution/src/source/mod.rs"
          git diff --check
          cargo fmt --all --check
          cargo check --locked -p uv-distribution
          cargo clippy --locked -p uv-distribution -- -D warnings

      - name: Publish clean one-file source
        run: |
          set -euo pipefail
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git switch -C candidate/20908-virtual-static-metadata
          git add crates/uv-distribution/src/source/mod.rs
          git commit -m 'Preserve virtual project static metadata errors'
          test "$(git diff --name-only "$SOURCE_BASE..HEAD")" = "crates/uv-distribution/src/source/mod.rs"
          git push origin HEAD:refs/heads/candidate/20908-virtual-static-metadata --force
          {
            echo "base=$SOURCE_BASE"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "source_blob=$(git rev-parse HEAD:crates/uv-distribution/src/source/mod.rs)"
          } > "$RUNNER_TEMP/publication-receipt.txt"

      - name: Retain publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: 20908-source-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-receipt.txt
          if-no-files-found: error
          retention-days: 14
