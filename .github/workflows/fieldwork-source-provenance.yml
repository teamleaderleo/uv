name: Fieldwork UV source provenance

on:
  push:
    branches:
      - research/source-provenance-order-20260802
      - research/validate-uv-dev-304-20260803
  pull_request:
    branches:
      - main
      - research/upstream-79bb-base
      - research/source-provenance-order-20260802
    paths:
      - .github/workflows/fieldwork-source-provenance.yml
      - fieldwork/source-provenance-probe/**
  workflow_dispatch:

concurrency:
  group: fieldwork-source-provenance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  released-versions:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/research/source-provenance-order-20260802' || (github.event_name == 'pull_request' && github.head_ref != 'research/validate-uv-dev-304-20260803')
    name: uv ${{ matrix.uv-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        uv-version:
          - 0.10.0
          - 0.10.10
          - 0.12.1

    steps:
      - name: Check out exact probe branch
        uses: actions/checkout@v5

      - name: Install uv ${{ matrix.uv-version }}
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ matrix.uv-version }}
          enable-cache: false

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Run source-provenance matrix
        env:
          UV_VERSION: ${{ matrix.uv-version }}
        run: bash fieldwork/source-provenance-probe/run.sh

      - name: Upload exact probe receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-source-provenance-${{ matrix.uv-version }}
          path: fieldwork/source-provenance-probe/out/
          if-no-files-found: error

  validate-uv-dev-304:
    if: github.ref == 'refs/heads/research/validate-uv-dev-304-20260803' || github.head_ref == 'research/validate-uv-dev-304-20260803' || github.event_name == 'workflow_dispatch'
    name: uv-dev #304 broader matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repair script
        run: python3 -m py_compile fieldwork/source-provenance-probe/apply_uv_dev_304_build_fix.py

      - name: Apply exact uv-dev #304 diff
        run: |
          git apply --check fieldwork/source-provenance-probe/uv-dev-304.diff
          git apply fieldwork/source-provenance-probe/uv-dev-304.diff

      - name: Apply isolated draft compile repair
        run: |
          python3 fieldwork/source-provenance-probe/apply_uv_dev_304_build_fix.py
          git diff --check
          test "$(git diff --name-only)" = "crates/uv-resolver/src/lock/mod.rs"

      - name: Install bootstrap uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
          enable-cache: false

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build patched uv
        run: cargo build --bin uv

      - name: Put patched uv first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/fieldwork-bin"
          ln -s "$GITHUB_WORKSPACE/target/debug/uv" "$RUNNER_TEMP/fieldwork-bin/uv"
          echo "$RUNNER_TEMP/fieldwork-bin" >> "$GITHUB_PATH"

      - name: Verify patched binary identity
        run: |
          command -v uv
          uv --version
          git diff --stat

      - name: Run editable and non-editable matrix
        env:
          UV_VERSION: uv-dev-304-675839b0-plus-semicolon
        run: bash fieldwork/source-provenance-probe/run.sh

      - name: Upload exact draft-validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-dev-304-source-provenance
          path: fieldwork/source-provenance-probe/out/
          if-no-files-found: warn
