name: Fieldwork materialize simple stub candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-stub-scaffold-current
          fetch-depth: 0

      - name: Apply tested conservative transform once
        shell: bash
        run: |
          set -euo pipefail
          target=crates/uv/src/commands/project/init.rs
          if grep -q 'fn is_simple_stub_project' "$target"; then
            echo 'Candidate source is already materialized.'
            exit 0
          fi

          curl -fsSL \
            https://raw.githubusercontent.com/teamleaderleo/linux-fieldwork/a9da687f64049be04e1d2b20b59f8fe14262c21a/investigations/uv-stubs-backend-scope/thunderdome/normalized_transform.py \
            -o "$RUNNER_TEMP/normalized_transform.py"

          python "$RUNNER_TEMP/normalized_transform.py" reject "$target"
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt
          cargo fmt --all
          git diff --check
          git diff --stat

          git config user.name 'linux-fieldwork-bot'
          git config user.email '13091533+teamleaderleo@users.noreply.github.com'
          git add "$target"
          git commit -m 'Implement simple stub scaffold backend adapters'
          git push origin HEAD:fix/simple-stub-scaffold-current
