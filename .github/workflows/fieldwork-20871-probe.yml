name: Fieldwork uv 20871 environment probe

on:
  push:
    branches:
      - fieldwork/20871-uvx-environment-isolation
    paths:
      - .github/workflows/fieldwork-20871-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build uv
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin uv
          ln -sf uv target/debug/uvx

      - name: Run isolation matrix
        shell: bash
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/fieldwork-uv-cache
          UV_TOOL_DIR: ${{ runner.temp }}/fieldwork-uv-tools
        run: |
          set -euo pipefail
          mkdir -p fieldwork/20871/results
          PATH="$PWD/target/debug:$PATH" \
            bash fieldwork/20871/probe.sh \
            | tee fieldwork/20871/results/probe.txt
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path('fieldwork/20871/results/probe.txt').read_text()
          sections = re.split(r'^== (.+) ==$', text, flags=re.MULTILINE)
          observed = {}
          for index in range(1, len(sections), 2):
              name = sections[index].strip()
              body = sections[index + 1].strip()
              observed[name] = json.loads(body)

          assert observed['clean']['marker'] == 'tool-environment', observed
          assert observed['sanitized']['marker'] == 'tool-environment', observed
          assert observed['ambient-pythonpath']['marker'] == 'ambient-pythonpath', observed
          assert observed['isolated-ambient-pythonpath']['marker'] == 'ambient-pythonpath', observed
          Path('fieldwork/20871/results/summary.json').write_text(
              json.dumps({name: {
                  'marker': value['marker'],
                  'module': value['module'],
                  'executable': value['executable'],
                  'prefix': value['prefix'],
                  'pythonpath': value['pythonpath'],
              } for name, value in observed.items()}, indent=2) + '\n'
          )
          PY
          git diff --check

      - name: Record receipt and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          cat > fieldwork/20871/receipt.md <<EOF
          # uv 20871 execution receipt

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Starting head: ${GITHUB_SHA}
          - Runner: ubuntu-latest with repository Rust toolchain
          - Clean case: imported the tool environment marker.
          - Ambient \`PYTHONPATH\`: imported the ambient marker.
          - \`--isolated\` plus ambient \`PYTHONPATH\`: still imported the ambient marker.
          - Sanitized isolated case: imported the tool environment marker.
          - Gate: \`cargo build --locked --bin uv\`, four-row local tool execution matrix, structured assertions, and \`git diff --check\`.
          - Evidence class: integration-executed local tool path on Linux; no production change yet.
          - Interpretation: the reported behavior is reproducible through inherited Python import variables, not through reuse of the surrounding project virtual environment.
          - Upstream contact: unauthorized and absent.
          EOF
          rm .github/workflows/fieldwork-20871-probe.yml
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add fieldwork/20871 .github/workflows/fieldwork-20871-probe.yml
          git commit -m "Record uvx ambient import-path probe [fieldwork executed]"
          git push origin HEAD:fieldwork/20871-uvx-environment-isolation
