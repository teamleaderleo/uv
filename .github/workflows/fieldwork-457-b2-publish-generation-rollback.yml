name: Fieldwork 457 B2 publish proven generation rollback

on:
  push:
    branches:
      - experiment/457-b2-current-head-generation-rollback
    paths:
      - .github/workflows/fieldwork-457-b2-publish-generation-rollback.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  CANDIDATE_HEAD: 8d9324af47e1b52ec1f57f9232bd408281282cf5
  EXPERIMENT_HEAD: 46df79f7979874bce882eef4c69d8042480a44c6
  ARTIFACT_ID: '8917521300'
  EXPECTED_SOURCE_SHA256: a1a526675686fcdb8dbb3bda6a29ea1b9cfc9cb867e3872603a8df9b83a4925e
  SOURCE_BRANCH: candidate/457-b2-windows-generation-rollback

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download and verify proven Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-receipt"
          curl --fail --location --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/windows-receipt.zip"
          unzip -q "$RUNNER_TEMP/windows-receipt.zip" \
            -d "$RUNNER_TEMP/windows-receipt"
          test -f "$RUNNER_TEMP/windows-receipt/generated-self-update.rs"
          grep -Fx "experiment_head=$EXPERIMENT_HEAD" \
            "$RUNNER_TEMP/windows-receipt/identity.txt"
          grep -Fx "candidate_head=$CANDIDATE_HEAD" \
            "$RUNNER_TEMP/windows-receipt/identity.txt"
          echo "$EXPECTED_SOURCE_SHA256  $RUNNER_TEMP/windows-receipt/generated-self-update.rs" \
            | sha256sum --check --strict

      - name: Commit exact one-file source candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/windows-receipt/generated-self-update.rs" \
            crates/uv/src/commands/self_update.rs
          git diff --check
          test "$(git diff --name-only "$CANDIDATE_HEAD")" = \
            'crates/uv/src/commands/self_update.rs'
          git config user.name 'Fieldwork Agent'
          git config user.email 'fieldwork-agent@users.noreply.github.com'
          git checkout -B "$SOURCE_BRANCH"
          git add crates/uv/src/commands/self_update.rs
          git diff --cached --check
          git commit -m 'Roll back failed Windows update generations'

          remote_head=$(git ls-remote --heads origin "refs/heads/$SOURCE_BRANCH" | cut -f1)
          if [[ -z "$remote_head" ]]; then
            lease="--force-with-lease=refs/heads/$SOURCE_BRANCH:"
          else
            test "$remote_head" = "$CANDIDATE_HEAD"
            lease="--force-with-lease=refs/heads/$SOURCE_BRANCH:$remote_head"
          fi
          git push "$lease" origin "HEAD:refs/heads/$SOURCE_BRANCH"

      - name: Record publication receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "artifact_id=$ARTIFACT_ID"
            echo "experiment_head=$EXPERIMENT_HEAD"
            echo "candidate_head=$CANDIDATE_HEAD"
            echo "source_sha256=$EXPECTED_SOURCE_SHA256"
            echo "published_head=$(git rev-parse HEAD)"
            echo "source_branch=$SOURCE_BRANCH"
          } > publication.txt

      - name: Upload publication receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-457-b2-generation-rollback-publication
          path: publication.txt
          if-no-files-found: error
          retention-days: 30
