name: Fieldwork 8523 credential rotation

on:
  pull_request:
    branches:
      - fieldwork/8523-credential-rotation-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_BASE: 507230998c9541d67814b57463ac00e454ff6991
    steps:
      - name: Check out carrier
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify carrier boundary
        run: |
          set -euo pipefail
          base_ref="origin/${{ github.event.pull_request.base.ref }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only "$base_ref...$head_sha" | sort)
          expected=(scripts/fieldwork/probe-8523-credential-rotation.py)
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")
          cp scripts/fieldwork/probe-8523-credential-rotation.py "$RUNNER_TEMP/probe.py"

      - name: Build exact current uv
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_BASE"
          cargo build --locked -p uv
          git diff --exit-code

      - name: Run rotating-credential probe
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/probe.py" \
            --uv "$(pwd)/target/debug/uv" \
            --root "$RUNNER_TEMP/uv-8523"

      - name: Retain transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-8523-credential-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uv-8523/transcript.txt
          if-no-files-found: warn
          retention-days: 14
