name: Fieldwork UV draft 304

on:
  push:
    branches:
      - research/source-provenance-order-20260802
    paths:
      - .github/workflows/fieldwork-draft304.yml
      - fieldwork/source-provenance-probe/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-304-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out fieldwork branch
        uses: actions/checkout@v5

      - name: Check out exact Astral draft source read-only
        uses: actions/checkout@v5
        with:
          repository: astral-sh/uv-dev
          ref: 675839b0b1b1c66ee3b02139e1237094722ec2b2
          path: draft304
          persist-credentials: false

      - name: Build exact draft uv binary
        run: cargo build --release --locked --bin uv
        working-directory: draft304

      - name: Install Python 3.12
        run: draft304/target/release/uv python install 3.12

      - name: Run unchanged source-provenance matrix
        env:
          UV_VERSION: draft304-675839b
        run: |
          mkdir -p "$RUNNER_TEMP/fieldwork-bin"
          ln -s "$GITHUB_WORKSPACE/draft304/target/release/uv" "$RUNNER_TEMP/fieldwork-bin/uv"
          export PATH="$RUNNER_TEMP/fieldwork-bin:$PATH"
          bash fieldwork/source-provenance-probe/run.sh

      - name: Upload exact draft receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-source-provenance-draft304-675839b
          path: fieldwork/source-provenance-probe/out/
          if-no-files-found: error
