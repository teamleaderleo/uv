name: Fieldwork 457 B2 current-head generation rollback

on:
  pull_request:
    paths:
      - .github/fieldwork/457-b2/inject_generation_rollback.py
      - .github/fieldwork/457-b2/polish_generation_rollback.py
      - .github/workflows/fieldwork-457-b2-current-head-generation-rollback.yml

permissions:
  contents: read

jobs:
  cross-target-check:
    name: Cross-check generated Windows source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_HEAD: 8d9324af47e1b52ec1f57f9232bd408281282cf5
      CI: 1
    steps:
      - name: Check out exact experiment
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact base and experiment fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$CANDIDATE_HEAD")" = "$CANDIDATE_HEAD"
          expected=$(printf '%s\n' \
            .github/fieldwork/457-b2/inject_generation_rollback.py \
            .github/fieldwork/457-b2/polish_generation_rollback.py \
            .github/workflows/fieldwork-457-b2-current-head-generation-rollback.yml | sort)
          actual=$(git diff --name-only "$CANDIDATE_HEAD..HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$CANDIDATE_HEAD..HEAD"
          mkdir -p receipt-cross
          {
            echo "experiment_head=$(git rev-parse HEAD)"
            echo "candidate_head=$CANDIDATE_HEAD"
            echo "runner=$RUNNER_OS"
          } > receipt-cross/identity.txt
          rustc --version | tee receipt-cross/rust-version.txt
          cargo --version | tee receipt-cross/cargo-version.txt

      - name: Apply and cross-check proposed source
        shell: bash
        run: |
          set -euo pipefail
          python .github/fieldwork/457-b2/inject_generation_rollback.py
          python .github/fieldwork/457-b2/polish_generation_rollback.py
          rustup component add rustfmt
          rustup target add x86_64-pc-windows-msvc
          cargo fmt --all
          cargo fmt --all --check 2>&1 | tee receipt-cross/fmt.log
          git diff --check
          git diff -- crates/uv/src/commands/self_update.rs > receipt-cross/proposed-source.diff
          cp crates/uv/src/commands/self_update.rs receipt-cross/generated-self-update.rs
          cargo check -p uv --all-targets --features self-update --target x86_64-pc-windows-msvc 2>&1 |
            tee receipt-cross/check.log

      - name: Upload cross-target receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-457-b2-current-head-generation-rollback-cross
          path: receipt-cross/
          if-no-files-found: error
          retention-days: 30

  generation-rollback:
    name: Windows ordinary-error generation rollback
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CANDIDATE_HEAD: 8d9324af47e1b52ec1f57f9232bd408281282cf5
      CI: 1
    steps:
      - name: Check out exact experiment
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact base and experiment fence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git merge-base HEAD $env:CANDIDATE_HEAD) -ne $env:CANDIDATE_HEAD) {
            throw 'Experiment does not descend from exact current public candidate'
          }
          $expected = @(
            '.github/fieldwork/457-b2/inject_generation_rollback.py'
            '.github/fieldwork/457-b2/polish_generation_rollback.py'
            '.github/workflows/fieldwork-457-b2-current-head-generation-rollback.yml'
          ) | Sort-Object
          $changed = @(git diff --name-only "$env:CANDIDATE_HEAD..HEAD") | Sort-Object
          if (Compare-Object $expected $changed) {
            throw "Unexpected experiment diff. Expected: $($expected -join ', '); actual: $($changed -join ', ')"
          }
          git diff --check "$env:CANDIDATE_HEAD..HEAD"
          New-Item -ItemType Directory -Force -Path receipt | Out-Null
          @(
            "experiment_head=$(git rev-parse HEAD)"
            "candidate_head=$env:CANDIDATE_HEAD"
            "runner=$env:RUNNER_OS"
          ) | Set-Content receipt/identity.txt
          rustc --version | Tee-Object -FilePath receipt/rust-version.txt
          cargo --version | Tee-Object -FilePath receipt/cargo-version.txt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: fieldwork-457-b2-current-head-generation-rollback
          cache-on-failure: true

      - name: Apply and lint proposed source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/fieldwork/457-b2/inject_generation_rollback.py
          python .github/fieldwork/457-b2/polish_generation_rollback.py
          rustup component add rustfmt
          cargo fmt --all
          cargo fmt --all --check 2>&1 | Tee-Object -FilePath receipt/fmt.log
          git diff --check
          git diff -- crates/uv/src/commands/self_update.rs | Set-Content receipt/proposed-source.diff
          Copy-Item crates/uv/src/commands/self_update.rs receipt/generated-self-update.rs

      - name: Run hostile rollback matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p uv --lib --features self-update fieldwork_current_head_generation_rollback -- --nocapture 2>&1 |
            Tee-Object -FilePath receipt/test.log

      - name: Check affected targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check -p uv --all-targets --features self-update 2>&1 |
            Tee-Object -FilePath receipt/check.log

      - name: Record experiment contract
        if: always()
        shell: pwsh
        run: |
          @{
            experimentHead = (git rev-parse HEAD)
            candidateHead = $env:CANDIDATE_HEAD
            platform = 'windows-latest'
            proposedGuarantee = 'every ordinary companion, receipt, or final-executable error restores the pre-update live generation'
            controls = @(
              'destructive finalizer error restores old uv, companions, receipt, and removes newly introduced files'
              'mid-companion-copy error restores prior companion state before receipt or finalizer'
              'success commits uv, companions, and receipt as the new generation'
            )
            excludedGuarantees = @(
              'power loss or process termination during rollback'
              'atomic multi-file visibility to concurrent observers'
              'custom or GHE axoupdater route'
            )
          } | ConvertTo-Json -Depth 4 | Set-Content receipt/contract.json

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-457-b2-current-head-generation-rollback
          path: receipt/
          if-no-files-found: error
          retention-days: 30

  materialize-source:
    name: Materialize validated source candidate
    needs:
      - cross-target-check
      - generation-rollback
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CANDIDATE_HEAD: 8d9324af47e1b52ec1f57f9232bd408281282cf5
      SOURCE_BRANCH: candidate/457-b2-windows-generation-rollback
    steps:
      - name: Check out validated experiment
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate exact product source on public candidate base
        shell: bash
        run: |
          set -euo pipefail
          cp .github/fieldwork/457-b2/inject_generation_rollback.py "$RUNNER_TEMP/inject_generation_rollback.py"
          cp .github/fieldwork/457-b2/polish_generation_rollback.py "$RUNNER_TEMP/polish_generation_rollback.py"
          git checkout --detach "$CANDIDATE_HEAD"
          python "$RUNNER_TEMP/inject_generation_rollback.py"
          python "$RUNNER_TEMP/polish_generation_rollback.py"
          rustup component add rustfmt
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only "$CANDIDATE_HEAD")" = 'crates/uv/src/commands/self_update.rs'

      - name: Commit source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fieldwork Agent'
          git config user.email 'fieldwork-agent@users.noreply.github.com'
          git checkout -B "$SOURCE_BRANCH"
          git add crates/uv/src/commands/self_update.rs
          git commit -m 'Roll back failed Windows update generations'
          git push --force-with-lease origin "HEAD:refs/heads/$SOURCE_BRANCH"
