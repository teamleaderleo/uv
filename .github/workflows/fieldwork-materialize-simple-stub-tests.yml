name: Fieldwork materialize simple stub tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-stub-scaffold-current
          fetch-depth: 0

      - name: Apply and validate UV-native tests once
        shell: bash
        run: |
          set -euo pipefail
          target=crates/uv/tests/project/init.rs
          if grep -q 'fn init_package_simple_stub' "$target"; then
            echo 'Candidate tests are already materialized.'
            cargo test --package uv --test it simple_stub -- --nocapture
            exit 0
          fi

          curl -fsSL \
            https://raw.githubusercontent.com/teamleaderleo/linux-fieldwork/b78c689f2dbdebb021dcc2d530c39bf7e0b8a751/investigations/uv-stubs-backend-scope/product/uv_native_tests_transform.py \
            -o "$RUNNER_TEMP/uv_native_tests_transform.py"

          python "$RUNNER_TEMP/uv_native_tests_transform.py" "$target"
          rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt
          cargo fmt --all
          git diff --check
          cargo test --package uv --test it simple_stub -- --nocapture

          git config user.name 'linux-fieldwork-bot'
          git config user.email '13091533+teamleaderleo@users.noreply.github.com'
          git add "$target"
          git commit -m 'Test simple stub scaffold backend behavior'
          git push origin HEAD:fix/simple-stub-scaffold-current
