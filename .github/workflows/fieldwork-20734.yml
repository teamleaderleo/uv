name: Fieldwork uv stubs package discriminator

on:
  pull_request:
    branches:
      - ci/uv-20734-base

permissions:
  contents: read

concurrency:
  group: fieldwork-20734-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Reproduce init and build-backend mismatch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout investigation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3
        with:
          cache-base: ci/uv-20734-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build uv
        run: cargo build --bin uv
      - name: Run exact discriminator
        run: bash .github/fieldwork/20734-stubs-init.sh
