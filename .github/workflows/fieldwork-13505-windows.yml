name: Verify uv 13505 Windows path-case dedup

on:
  pull_request:
    branches:
      - main
    paths:
      - fieldwork/13505/WINDOWS_EXECUTION_TRIGGER.md

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'execution/13505-windows-case-dedup'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      INSTA_UPDATE: no
    steps:
      - name: Check out immutable investigation packet
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: teamleaderleo/uv
          ref: bef3a851268867f6c85cab49aa998471cc7af873
          path: packet
          persist-credentials: false

      - name: Check out exact baseline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: teamleaderleo/uv
          ref: 1da26a68629be6ae5fd7f924a7d49ff54763a7df
          path: baseline
          persist-credentials: false

      - name: Check out exact candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: teamleaderleo/uv
          ref: 1da26a68629be6ae5fd7f924a7d49ff54763a7df
          path: candidate
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"

      - name: Install required Python versions
        run: uv python install 3.11 3.12

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Apply baseline and candidate controls
        run: |
          python packet/fieldwork/13505/apply_candidate.py baseline --tests-only
          python packet/fieldwork/13505/apply_candidate.py candidate
          git -C baseline diff --check
          git -C candidate diff --check

      - name: Require baseline behavioral failure
        shell: pwsh
        run: |
          Push-Location baseline
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          & cmd.exe /d /s /c "cargo test --package uv --test python python_list_duplicate_path_entries --no-default-features --features test-python -- --nocapture > baseline-output.txt 2>&1"
          $status = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Get-Content baseline-output.txt
          Pop-Location

          if ($status -eq 0) {
            throw 'baseline unexpectedly passed the Windows case-variant integration control'
          }
          $text = Get-Content baseline/baseline-output.txt -Raw
          if ($text -match 'could not compile') {
            throw 'baseline failed during compilation instead of behavioral execution'
          }
          if ($text -notmatch 'running 1 test') {
            throw 'baseline failure did not execute exactly one focused test'
          }
          if ($text -notmatch 'python_list_duplicate_path_entries') {
            throw 'baseline failure did not reach the focused integration test'
          }

      - name: Run candidate formatting and controls
        shell: pwsh
        run: |
          Push-Location candidate
          cargo fmt --all -- --check
          cargo test --package uv --lib windows_path_case_variants_are_deduplicated --no-default-features --features test-python -- --nocapture 2>&1 | Tee-Object candidate-unit-output.txt
          if ($LASTEXITCODE -ne 0) { throw 'candidate ordinal unit control failed' }
          cargo test --package uv --test python python_list_duplicate_path_entries --no-default-features --features test-python -- --nocapture 2>&1 | Tee-Object candidate-integration-output.txt
          if ($LASTEXITCODE -ne 0) { throw 'candidate integration control failed' }
          git diff --check

          $actual = @(
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Sort-Object
          $expected = @(
            'crates/uv-windows/src/lib.rs',
            'crates/uv-windows/src/path.rs',
            'crates/uv/src/commands/python/list.rs',
            'crates/uv/tests/python/python_list.rs'
          ) | Sort-Object
          $difference = Compare-Object $expected $actual
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Host
            throw 'unexpected candidate diff fence'
          }
          Pop-Location

      - name: Verify carrier remained read-only
        run: |
          if ((git -C baseline rev-parse HEAD) -ne '1da26a68629be6ae5fd7f924a7d49ff54763a7df') { throw 'baseline head moved' }
          if ((git -C candidate rev-parse HEAD) -ne '1da26a68629be6ae5fd7f924a7d49ff54763a7df') { throw 'candidate head moved' }
          Write-Host 'uv 13505 Windows baseline/candidate matrix passed'

      - name: Retain Windows execution transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uv-13505-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            baseline/baseline-output.txt
            candidate/candidate-unit-output.txt
            candidate/candidate-integration-output.txt
          if-no-files-found: warn
          retention-days: 30
